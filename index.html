<!DOCTYPE html>
<html lang="fr" data-accent="violet" data-anim="true" data-compact="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06050b">
<meta name="color-scheme" content="dark">
<title>NEXORA AI — Votre entreprise. Votre équipe. Votre intelligence artificielle.</title>
<!--
  ╔══════════════════════════════════════════════════════════════════════════╗
  ║  NEXORA AI  ·  v2.0  ·  Fichier unique (HTML + CSS + JS)                   ║
  ║  Aucun backend, aucune base externe, aucun paiement.                       ║
  ║  Données : localStorage (réglages, missions…) + IndexedDB (documents…).    ║
  ║                                                                            ║
  ║  ORGANISATION DU CODE (modules logiques internes, dans l'ordre) :          ║
  ║   1. Utils / Bus / Markdown / CSV          6. Moteur local de démonstration║
  ║   2. Store (localStorage + IndexedDB)      7. Directeur IA + exécuteur     ║
  ║   3. Données : départements & 34 agents    8. Communications + anti-boucle ║
  ║   4. État applicatif (S) + sauvegardes     9. Vues (14 espaces) + 3D       ║
  ║   5. Fournisseurs IA (optionnels)         10. Diagnostic + démarrage       ║

  ╚══════════════════════════════════════════════════════════════════════════╝

<style>
/* ============================ 1. TOKENS ============================ */
:root{
  --bg:#06050b;--bg-2:#0b0914;--panel:#100e1d;--panel-2:#161329;--panel-3:#1e1a38;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
  --text:#f4f3fb;--muted:#a09cbd;--dim:#6f6c8b;
  --violet:#8b5cf6;--violet-2:#a78bfa;--blue:#38bdf8;--orange:#fb923c;
  --ok:#34d399;--warn:#fbbf24;--err:#f87171;
  --accent:var(--violet);--accent-2:var(--blue);
  --radius:16px;--radius-s:10px;--shadow:0 12px 40px rgba(0,0,0,.5);
  --fs:1;--pad:22px;
}
html[data-accent=blue]{--accent:#38bdf8;--accent-2:#8b5cf6}
html[data-accent=orange]{--accent:#fb923c;--accent-2:#8b5cf6}
html[data-compact=true]{--pad:14px}
html[data-anim=false] *,html[data-anim=false] *::before,html[data-anim=false] *::after{animation:none!important;transition:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(15px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--text);overflow-x:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;
  background:radial-gradient(1100px 600px at 8% -10%,rgba(139,92,246,.2),transparent 60%),
             radial-gradient(900px 520px at 105% 0%,rgba(56,189,248,.13),transparent 55%),
             radial-gradient(700px 400px at 50% 120%,rgba(251,146,60,.08),transparent 60%),var(--bg);
  background-attachment:fixed}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.92rem}
p{margin:0 0 .6em}a{color:var(--accent-2)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2548;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:.82rem}.tiny{font-size:.72rem}.nowrap{white-space:nowrap}
.hide{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}.right{margin-left:auto}.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}.mb{margin-bottom:14px}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap-any{overflow-wrap:anywhere}

/* ============================ 2. LAYOUT ============================ */
#app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100dvh}
#sidebar{position:sticky;top:0;height:100dvh;overflow:auto;padding:18px 14px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,14,29,.92),rgba(8,7,16,.92));backdrop-filter:blur(14px)}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 12px rgba(139,92,246,.7))}
.brand b{display:block;font-size:1.05rem;letter-spacing:.14em}
.brand span{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.04em;line-height:1.25}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.92rem;border:1px solid transparent;transition:.18s}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(56,189,248,.08));border-color:rgba(139,92,246,.4);box-shadow:0 0 22px rgba(139,92,246,.16)}
.nav a i{width:22px;text-align:center;font-style:normal;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.nav .badge{margin-left:auto}
#main{min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:12px var(--pad);
  background:rgba(6,5,11,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#topbar h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{padding:var(--pad);width:100%;max-width:1480px;margin:0 auto;min-width:0}
#bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(10,8,20,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line-2);justify-content:space-around}
#bottomnav button,#bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;background:none;color:var(--muted);
  font-size:.66rem;text-decoration:none;border-radius:12px;min-height:50px;cursor:pointer}
#bottomnav i{font-style:normal;font-size:1.2rem}
#bottomnav .on{color:#fff;background:rgba(139,92,246,.2)}
@media (max-width:960px){
  #app{grid-template-columns:minmax(0,1fr)}#sidebar{display:none}#bottomnav{display:flex}
  #view{padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
  #topbar{padding:10px 14px}
  h1{font-size:1.3rem}
  .hide-m{display:none!important}
}
@media (min-width:961px){.only-m{display:none!important}}
@media (min-width:1900px){html{font-size:calc(16.5px * var(--fs))}#view{max-width:1800px}}

/* ============================ 3. COMPOSANTS ============================ */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;min-width:0}
.card.glow{border-color:rgba(139,92,246,.4);box-shadow:0 0 0 1px rgba(139,92,246,.1),0 0 40px rgba(139,92,246,.12)}
.card.click{cursor:pointer;transition:.2s}.card.click:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.5);box-shadow:0 8px 30px rgba(139,92,246,.15)}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px;min-width:0}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid.auto-s{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.grid.auto-l{grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:900px){.grid.c2,.grid.c3,.grid.side{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-weight:600;font-size:.88rem;transition:.18s;min-height:40px;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
.btn:disabled,.btn.dis{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#07060f;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ora{background:linear-gradient(135deg,#fb923c,#f97316);border-color:transparent;color:#1a0b00}
.btn.dng{border-color:rgba(248,113,113,.45);color:#fecaca;background:rgba(248,113,113,.08)}.btn.dng:hover{background:rgba(248,113,113,.2)}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.8rem;border-radius:10px}
.btn.ghost{background:transparent}.btn.ico{padding:8px;min-width:40px}
input[type=text],input[type=number],input[type=search],input[type=time],input[type=date],input[type=datetime-local],input[type=password],input[type=url],select,textarea{
  width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;outline:none;min-height:42px;transition:.15s}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
select option{background:#14112a;color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
label.f{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 5px;font-weight:600;letter-spacing:.02em}
.chk{display:flex;gap:9px;align-items:center;padding:7px 4px;font-size:.88rem;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.72rem;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--muted);white-space:nowrap}
.chip.btnlike{cursor:pointer;transition:.15s}.chip.btnlike:hover,.chip.on{background:rgba(139,92,246,.22);color:#fff;border-color:rgba(139,92,246,.6)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.03em;background:rgba(139,92,246,.2);color:#d9ccff;border:1px solid rgba(139,92,246,.4);white-space:nowrap}
.badge.ok{background:rgba(52,211,153,.14);color:#a7f3d0;border-color:rgba(52,211,153,.4)}
.badge.warn{background:rgba(251,191,36,.14);color:#fde68a;border-color:rgba(251,191,36,.4)}
.badge.err{background:rgba(248,113,113,.14);color:#fecaca;border-color:rgba(248,113,113,.4)}
.badge.blue{background:rgba(56,189,248,.14);color:#bae6fd;border-color:rgba(56,189,248,.4)}
.badge.ora{background:rgba(251,146,60,.16);color:#fed7aa;border-color:rgba(251,146,60,.45)}
.badge.gray{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 10px var(--c,#888);flex:none}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.kpi b{font-size:1.75rem;line-height:1.1;background:linear-gradient(135deg,#fff,var(--violet-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:.76rem;color:var(--muted)}.kpi small{font-size:.7rem;color:var(--dim)}
.progress{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:32%;font-weight:800;color:#fff;letter-spacing:.02em;
  background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.35),transparent 42%),linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.18);text-shadow:0 1px 4px rgba(0,0,0,.45)}
.av .st{position:absolute;right:-2px;bottom:-2px;width:34%;height:34%;border-radius:50%;background:var(--c);border:2px solid var(--bg-2);box-shadow:0 0 10px var(--c)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.tabs button.on{background:rgba(139,92,246,.25);color:#fff;border-color:rgba(139,92,246,.6)}
.banner{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-size:.86rem}
.banner.info{border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.07)}
.banner.warn{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.07)}
.banner.err{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
.banner.sim{border-color:rgba(251,146,60,.55);background:repeating-linear-gradient(45deg,rgba(251,146,60,.1),rgba(251,146,60,.1) 12px,rgba(251,146,60,.04) 12px,rgba(251,146,60,.04) 24px)}
.banner.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:6px}
.sect{display:flex;align-items:center;gap:12px;margin:22px 0 12px;flex-wrap:wrap}.sect h2{margin-right:auto}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.page-head p{margin:4px 0 0;color:var(--muted);max-width:760px}.page-head>.grow{flex:1 1 340px}@media (max-width:600px){.page-head>.grow{flex-basis:100%}}
.sub{color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:.88rem}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.03);white-space:nowrap}
tr:last-child td{border-bottom:0}
@media (max-width:700px){
  .rtable thead{display:none}.rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{padding:10px 4px;border-bottom:1px solid var(--line)}.rtable td{border:0;padding:3px 10px;display:flex;gap:10px;justify-content:space-between}
  .rtable td::before{content:attr(data-l);color:var(--dim);font-size:.72rem;text-transform:uppercase;flex:none}
  .rtable td>*{min-width:0;text-align:right;overflow-wrap:anywhere}
}
/* rendered markdown */
.md{font-size:.93rem;overflow-wrap:anywhere}.md h2,.md h3,.md h4,.md h5{margin:1.1em 0 .5em}.md h2{font-size:1.25rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.md h3{font-size:1.08rem;color:var(--violet-2)}.md ul,.md ol{padding-left:1.3em;margin:.4em 0 .8em}.md li{margin:.25em 0}
.md blockquote{margin:.6em 0;padding:8px 14px;border-left:3px solid var(--orange);background:rgba(251,146,60,.07);border-radius:0 10px 10px 0;color:#fed7aa}
.md code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:.88em}
.md pre{background:rgba(0,0,0,.45);padding:12px;border-radius:12px;overflow:auto;border:1px solid var(--line)}.md pre code{background:none;padding:0}
.md .tablewrap{margin:.7em 0}.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
/* modal / toast */
.modal-back{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,2,8,.72);backdrop-filter:blur(6px);animation:fade .18s}
.modal{width:min(100%,var(--mw,720px));max-height:min(92dvh,900px);display:flex;flex-direction:column;border-radius:20px;border:1px solid rgba(139,92,246,.4);
  background:linear-gradient(180deg,#171332,#0d0b1c);box-shadow:var(--shadow),0 0 60px rgba(139,92,246,.15);animation:pop .22s}
.modal.lg{--mw:1000px}.modal.sm{--mw:460px}
.modal-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-h h2{flex:1;min-width:0}
.modal-b{padding:16px 18px;overflow:auto;flex:1;min-height:0}.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
@media (max-width:600px){.modal-back{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;max-height:94dvh}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
#toast-root{position:fixed;right:14px;top:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,380px)}
.toast{padding:11px 15px;border-radius:14px;background:#151230;border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:.88rem;animation:pop .2s}
.toast.ok{border-color:rgba(52,211,153,.55)}.toast.err{border-color:rgba(248,113,113,.6)}.toast.warn{border-color:rgba(251,191,36,.6)}
@media (max-width:960px){#toast-root{top:auto;bottom:calc(84px + env(safe-area-inset-bottom));right:10px;left:10px;max-width:none}}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:52dvh;overflow:auto;padding:4px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(56,189,248,.25));border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub small{display:block;color:var(--dim);margin-top:4px;font-size:.68rem}
/* timeline */
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl .it{position:relative;padding:6px 0 12px}.tl .it::before{content:"";position:absolute;left:-20px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.tl .it.done::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px var(--ok)}.tl .it.run::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.2s infinite}
.tl .it.err::before{background:var(--err);border-color:var(--err)}.tl .it.skip::before{border-style:dashed}
/* bars */
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}.bar .t{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.bar .t i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
svg.chart{width:100%;height:auto;display:block}svg.chart text{fill:#9c98b8;font-size:11px}svg.chart .grid{stroke:rgba(255,255,255,.07);fill:none}
/* hero + console */
.hero{padding:22px;border-radius:22px;border:1px solid rgba(139,92,246,.45);position:relative;overflow:hidden;
  background:radial-gradient(600px 240px at 90% 0%,rgba(56,189,248,.18),transparent 70%),radial-gradient(500px 260px at 0% 100%,rgba(139,92,246,.28),transparent 70%),linear-gradient(180deg,#14102a,#0b0919)}
.hero h1{font-size:1.7rem;background:linear-gradient(90deg,#fff,var(--violet-2) 60%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.console{display:flex;gap:10px;align-items:flex-end}.console textarea{min-height:56px;max-height:220px}
.sig{letter-spacing:.06em;color:var(--muted);font-size:.8rem}
/* office */
.office-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(139,92,246,.4);background:#05040b;height:min(68dvh,640px);min-height:380px}

/* Markdown allégé, sécurisé (tout est échappé avant mise en forme) */
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function mdCells(row){ return row.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim()); }
function md(src){
  const L = String(src||'').replace(/\r/g,'').split('\n'); const out=[]; let i=0, m;
  const isBlock = l => /^(#{1,4}\s|>\s?|```|\s*[-*]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|\s*(---|\*\*\*)\s*$)/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){ const b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>'); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ const n=m[1].length+1; out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(l)){ const b=[]; while(i<L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,'')); out.push('<blockquote>'+mdInline(b.join(' '))+'</blockquote>'); continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<L.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1]) && L[i+1].includes('-')){
      const head=mdCells(l); i+=2; const rows=[];
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(mdCells(L[i++]));
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,k)=>`<td>${mdInline(r[k]||'')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'); continue;
    }
    if(/^\s*[-*]\s+/.test(l)){ const b=[]; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) b.push(L[i++].replace(/^\s*[-*]\s+/,'')); out.push('<ul>'+b.map(x=>'<li>'+mdInline(x.replace(/^\[ \]\s/,'☐ ').replace(/^\[[xX]\]\s/,'☑ '))+'</li>').join('')+'</ul>'); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const b=[]; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) b.push(L[i++].replace(/^\s*\d+[.)]\s+/,'')); out.push('<ol>'+b.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</ol>'); continue; }
    if(!l.trim()){ i++; continue; }
    const b=[l]; i++; while(i<L.length && L[i].trim() && !isBlock(L[i])) b.push(L[i++]);
    out.push('<p>'+mdInline(b.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* CSV : lecture tolérante (séparateur , ; tab auto) + écriture */
function parseCSV(text){
  text = String(text||'').replace(/^﻿/,''); if(!text.trim()) return [];
  const first = text.split('\n')[0]; const cand=[',',';','\t','|'];
  const sep = cand.map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell.replace(/\r$/,'')); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function toCSV(rows, sep=';'){ return '﻿'+rows.map(r=>r.map(c=>{ c=String(c??''); return /[";\n,]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(sep)).join('\r\n'); }
function mdTableToRows(src){
  const L=String(src||'').split('\n'); for(let i=0;i<L.length-1;i++){
    if(/^\s*\|.*\|\s*$/.test(L[i]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1]) && L[i+1].includes('-')){
      const rows=[mdCells(L[i])]; let j=i+2; while(j<L.length && /^\s*\|.*\|\s*$/.test(L[j])) rows.push(mdCells(L[j++])); return rows;
    }
  } return null;
}
function download(name, content, mime='text/plain'){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; }
  }
}
const readText = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||'')); r.onerror=()=>rej(r.error); r.readAsText(f); });
const readBuf  = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(f); });
const blobToB64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
const b64ToBlob = (b64,type) => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||'application/octet-stream'}); };

/* ═══════════════════════════════════════════════════════════════════════════
   2. STORE : localStorage (petites données) + IndexedDB (volumineux)
   ═══════════════════════════════════════════════════════════════════════════ */
const LS_PREFIX = 'nx2.';
const IDB_STORES = ['comms','deliverables','files','blobs','chats','backups'];
const IDB = {
  db:null, ok:false, mem:{},
  open(){
    return new Promise(res=>{
      try{
        if(!window.indexedDB) return res(false);
        const rq = indexedDB.open('nexora_ai', 2);
        rq.onupgradeneeded = () => { const db=rq.result; IDB_STORES.forEach(n=>{ if(!db.objectStoreNames.contains(n)) db.createObjectStore(n,{keyPath: n==='chats'?'agentId':'id'}); }); };
        rq.onsuccess = () => { this.db=rq.result; this.ok=true; res(true); };
        rq.onerror = () => res(false); rq.onblocked = () => res(false);
      }catch(e){ res(false); }
    });
  },
  _m(store){ return this.mem[store] || (this.mem[store]=new Map()); },
  _kp(store){ return store==='chats'?'agentId':'id'; },
  all(store){ return new Promise(res=>{ if(!this.ok) return res(Array.from(this._m(store).values())); try{ const r=this.db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }catch(e){ res([]); } }); },
  get(store,key){ return new Promise(res=>{ if(!this.ok) return res(this._m(store).get(key)); try{ const r=this.db.transaction(store).objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined); }catch(e){ res(undefined); } }); },
  put(store,obj){ return new Promise(res=>{ if(!this.ok){ this._m(store).set(obj[this._kp(store)],obj); return res(true); } try{ const t=this.db.transaction(store,'readwrite'); t.objectStore(store).put(obj); t.oncomplete=()=>res(true); t.onerror=()=>{ Err.log('idb.put '+store,t.error); res(false); }; t.onabort=()=>{ Err.log('idb.abort '+store,t.error); res(false); }; }catch(e){ Err.log('idb.put',e); res(false); } }); },
  del(store,key){ return new Promise(res=>{ if(!this.ok){ this._m(store).delete(key); return res(true); } try{ const t=this.db.transaction(store,'readwrite'); t.objectStore(store).delete(key); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); },
  clear(store){ return new Promise(res=>{ if(!this.ok){ this._m(store).clear(); return res(true); } try{ const t=this.db.transaction(store,'readwrite'); t.objectStore(store).clear(); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); }
};
const LS = {
  ok:true,
  get(k, def){ try{ const v=localStorage.getItem(LS_PREFIX+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); return true; }catch(e){ Err.log('localStorage.'+k, e); Bus.emit('quota', e); return false; } },
  del(k){ try{ localStorage.removeItem(LS_PREFIX+k); }catch(e){} },
  size(){ let n=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(LS_PREFIX)) n+=k.length+(localStorage.getItem(k)||'').length; } }catch(e){} return n*2; }
};

  for(const k of Object.keys(over)){ out[k] = isObj(base[k]) && isObj(over[k]) ? deepMerge(base[k], over[k]) : over[k]; }
  return out;
}
const Persist = {
  timers:{},
  saveSoon(k){ if(S.readOnly) return; S.dirty=true; clearTimeout(this.timers[k]); this.timers[k]=setTimeout(()=>this.save(k),300); },
  save(k){ if(S.readOnly) return; delete this.timers[k]; LS.set(k, S[k]); S.meta.updated=now(); LS.set('meta', S.meta); },
  flush(){ Object.keys(this.timers).forEach(k=>{ clearTimeout(this.timers[k]); this.save(k); }); },
  all(){ LS_COLLECTIONS.forEach(k=>this.save(k)); }
};
window.addEventListener('beforeunload', ()=>Persist.flush());
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) Persist.flush(); });

/* Migrations de schéma : ne jamais perdre de données sans accord (une sauvegarde est faite avant). */
const MIGRATIONS = {
  /* exemple futur : 3: data => { data.settings.newField = data.settings.newField ?? 'x'; } */
};
async function loadState(){
  const meta = LS.get('meta', null);
  S.meta = meta || {schema:NX.schema, created:now(), appVersion:NX.version};
  if(meta && meta.schema > NX.schema){
    S.readOnly = true;
    S.warnings.push('Ces données ont été créées par une version plus récente de NEXORA AI. Elles sont protégées : la sauvegarde automatique est désactivée pour éviter toute perte.');
  }
  S.settings = deepMerge(DEFAULT_SETTINGS, LS.get('settings', {}));
  S.profile = Object.assign({type:'', activity:'', sector:'', goals:'', difficulties:'', tasksAuto:'', teamSize:34, autonomy:'autonome', done:false, skipped:false}, LS.get('profile', {}));
  S.agentState = LS.get('agentState', {}) || {};
  S.customAgents = LS.get('customAgents', []) || [];
  S.missions = LS.get('missions', []) || [];
  S.automations = LS.get('automations', []) || [];
  S.activity = LS.get('activity', []) || [];
  S.usage = deepMerge({days:{}, total:{in:0,out:0,calls:0,local:0,model:0}}, LS.get('usage', {}));
  S.trading = deepMerge(DEFAULT_TRADING, LS.get('trading', {}));
  S.notes = LS.get('notes', []) || [];
  const idbOk = await IDB.open();
  if(!idbOk) S.warnings.push('Le stockage durable (IndexedDB) est indisponible dans ce navigateur (navigation privée ?). Documents et échanges seront perdus à la fermeture : pensez à exporter vos données.');
  S.comms = (await IDB.all('comms')).sort((a,b)=>b.ts-a.ts);
  S.deliverables = (await IDB.all('deliverables')).sort((a,b)=>b.createdAt-a.createdAt);
  S.files = (await IDB.all('files')).sort((a,b)=>b.addedAt-a.addedAt);
  S.chats = Object.fromEntries((await IDB.all('chats')).map(c=>[c.agentId,c]));
  Keys.load();
  /* migration éventuelle */
  const from = (meta && meta.schema) || NX.schema;
  if(!S.readOnly && from < NX.schema){
    await Backup.snapshot('Avant migration vers le schéma '+NX.schema);
    for(let v=from+1; v<=NX.schema; v++){ if(MIGRATIONS[v]){ try{ MIGRATIONS[v](S); }catch(e){ Err.log('migration '+v, e); } } }
    S.meta.schema = NX.schema;
  }
  S.meta.appVersion = NX.version; if(!S.meta.created) S.meta.created = now();
  /* sanitisation minimale */
  ['customAgents','missions','automations','activity','notes'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  /* missions interrompues par la fermeture : on ne prétend pas qu'elles continuent en arrière-plan */
  S.missions.forEach(m=>{
    if(m.status==='En cours'){ m.status='En attente'; m.interrupted=true; (m.log=m.log||[]).push({ts:now(), text:'Mission interrompue par la fermeture ou le rechargement de la page. Relancez-la pour reprendre.'});
      (m.steps||[]).forEach(s=>{ if(s.status==='en cours') s.status='à faire'; }); }
  });
  Agents.ensureState();
}

/* Sauvegardes locales (IndexedDB) : légères (sans fichiers binaires), les 6 dernières sont conservées */
const Backup = {
  async build(includeFiles){
    const data = {};
    LS_COLLECTIONS.forEach(k=>{ data[k] = JSON.parse(JSON.stringify(S[k])); });
    data.comms = S.comms; data.deliverables = S.deliverables; data.files = S.files;
    data.chats = Object.values(S.chats);
    if(includeFiles){
      data.blobs = [];
      for(const f of S.files){ const b = await IDB.get('blobs', f.id); if(b && b.blob){ try{ data.blobs.push({id:f.id, type:b.blob.type||f.type, b64:await blobToB64(b.blob)}); }catch(e){ Err.log('export blob',e); } } }
    }
    return {app:'NEXORA AI', schema:NX.schema, appVersion:NX.version, exportedAt:now(), includesFiles:!!includeFiles, data};
  },
  async snapshot(reason){
    try{
      const obj = await this.build(false); const json = JSON.stringify(obj);
      await IDB.put('backups', {id:uid('bk'), ts:now(), reason:reason||'Sauvegarde', size:json.length, json});
      const all = (await IDB.all('backups')).sort((a,b)=>b.ts-a.ts);
      for(const b of all.slice(6)) await IDB.del('backups', b.id);
      S.lastBackup = now(); S.dirty = false; return true;
    }catch(e){ Err.log('backup', e); return false; }
  },
  async list(){ return (await IDB.all('backups')).sort((a,b)=>b.ts-a.ts); },
  validate(obj){
    if(!isObj(obj) || obj.app!=='NEXORA AI' || !isObj(obj.data)) return 'Ce fichier n’est pas une sauvegarde NEXORA AI.';
    if(typeof obj.schema!=='number') return 'Version de données absente.';
    if(obj.schema > NX.schema) return 'Cette sauvegarde provient d’une version plus récente de NEXORA AI : mise à jour nécessaire avant import.';
    const d = obj.data;
    for(const k of ['missions','automations','customAgents','activity','notes','comms','deliverables','files']) if(d[k]!==undefined && !Array.isArray(d[k])) return 'Données invalides : « '+k+' » devrait être une liste.';
    return '';
  },
  /* mode : 'replace' (remplace tout, après sauvegarde de sécurité) ou 'merge' (ajoute ce qui manque, par identifiant) */
  async apply(obj, mode){
    const err = this.validate(obj); if(err) throw new Error(err);
    await this.snapshot('Avant import ('+mode+')');
    let d = JSON.parse(JSON.stringify(obj.data));
    for(let v=(obj.schema||1)+1; v<=NX.schema; v++){ if(MIGRATIONS[v]) MIGRATIONS[v](d); }
    const lists = ['customAgents','missions','automations','activity','notes'];
    if(mode==='replace'){
      if(d.settings) S.settings = deepMerge(DEFAULT_SETTINGS, d.settings);
      if(d.profile) S.profile = Object.assign(S.profile, d.profile);
      if(d.agentState) S.agentState = d.agentState;
      lists.forEach(k=>{ S[k] = d[k] || []; });
      if(d.usage) S.usage = deepMerge({days:{}, total:{in:0,out:0,calls:0,local:0,model:0}}, d.usage);
      if(d.trading) S.trading = deepMerge(DEFAULT_TRADING, d.trading);
      for(const st of IDB_STORES.filter(s=>s!=='backups')) await IDB.clear(st);
      S.comms=[]; S.deliverables=[]; S.files=[]; S.chats={};
    } else {
      lists.forEach(k=>{ const ids = new Set(S[k].map(x=>x.id)); (d[k]||[]).forEach(x=>{ if(x && !ids.has(x.id)) S[k].push(x); }); });
      Object.entries(d.agentState||{}).forEach(([id,v])=>{ if(!S.agentState[id]) S.agentState[id]=v; });
    }
    const addIds = {comms:new Set(S.comms.map(x=>x.id)), deliverables:new Set(S.deliverables.map(x=>x.id)), files:new Set(S.files.map(x=>x.id))};
    for(const st of ['comms','deliverables','files']){
      for(const x of (d[st]||[])){ if(x && x.id && !addIds[st].has(x.id)){ S[st].push(x); await IDB.put(st, x); } }
    }
    for(const c of (d.chats||[])){ if(c && c.agentId && !(S.chats[c.agentId] && mode==='merge')){ S.chats[c.agentId]=c; await IDB.put('chats', c); } }
    for(const b of (d.blobs||[])){ try{ await IDB.put('blobs', {id:b.id, blob:b64ToBlob(b.b64, b.type)}); }catch(e){ Err.log('import blob', e); } }
    S.comms.sort((a,b)=>b.ts-a.ts); S.deliverables.sort((a,b)=>b.createdAt-a.createdAt); S.files.sort((a,b)=>b.addedAt-a.addedAt);
    Agents.invalidate(); Agents.ensureState(); Persist.all(); Bus.emit('all');
  },
  async reset(){
    await this.snapshot('Avant réinitialisation');
    for(const st of IDB_STORES.filter(s=>s!=='backups')) await IDB.clear(st);
    LS_COLLECTIONS.forEach(k=>LS.del(k)); LS.del('meta'); LS.del('keys'); Keys.forget();
  }
};

const DEFAULT_PERM = {receiveMissions:true, messageAgents:true, readKnowledge:true, useAI:true};

    const merge = a => { const st=S.agentState[a.id]; const ov=(st&&st.ov)||{}; return Object.assign({}, a, {perm:Object.assign({}, DEFAULT_PERM, a.perm||{})}, ov, {edited:Object.keys(ov).length>0}); };

  },
  get(id){ if(id==='DIR') return DIRECTOR; return this.all().find(a=>a.id===id) || null; },
  isActive(id){ const a=this.get(id); const st=S.agentState[id]; return !!a && (!st || st.active!==false) && !(a.disabled); },
  canReceive(id){ const a=this.get(id); return !!a && this.isActive(id) && a.perm.receiveMissions!==false; },

  byDept(d){ return this.all().filter(a=>a.dept===d); },
  st(id){ const s=S.agentState[id]; return (s && s.status) || 'dispo'; },

  ensureState(){
    this.all().forEach(a=>{ const s=this.state(a.id); s.status='dispo'; s.missionId=null; if(!s.mem) s.mem=[]; if(!s.stats) s.stats={done:0,failed:0,tokens:0}; if(s.active===undefined) s.active=true; if(!s.ov) s.ov={}; });
    this.state('DIR');

  setStatus(id, key, missionId){

    s.status = key; s.since = now(); if(missionId!==undefined) s.missionId = missionId;
    if(key==='termine'){ clearTimeout(this._t&&this._t[id]); (this._t=this._t||{})[id]=setTimeout(()=>{ if(Agents.st(id)==='termine'){ Agents.setStatus(id,'dispo',null); } }, 9000); }

  },
  setActive(id, on){ this.state(id).active = !!on; Persist.saveSoon('agentState'); Bus.emit('agents',{id}); },
  remember(id, text, missionId){

    Persist.saveSoon('agentState');

  /* Création d'un agent personnalisé : le cadre de travail est construit à partir de ses compétences */

/* Lecteurs de formats : extraction réelle uniquement si le moteur est disponible, sinon « stocké, non lu » */
const CDN = {
  pdfjs:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfworker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const Readers = {
  kindOf(f){
    const n = norm(f.name); const ext = (n.match(/\.([a-z0-9]+)$/)||[])[1]||'';
    if(['txt','md','markdown','json','log','html','htm','xml','yml','yaml','js','css'].includes(ext) || f.type.startsWith('text/') && ext!=='csv') return 'text';
    if(['csv','tsv'].includes(ext) || f.type==='text/csv') return 'csv';
    if(ext==='pdf' || f.type==='application/pdf') return 'pdf';
    if(ext==='docx') return 'docx';
    if(['xlsx','xls','xlsm'].includes(ext)) return 'xlsx';
    if(f.type.startsWith('image/') || ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext)) return 'image';
    return 'other';
  },
  async extract(file, kind){
    const MAX = 600000;
    if(kind==='text' || kind==='csv'){ const t = await readText(file); return {text:t.slice(0,MAX), readable:true, note: t.length>MAX?'Texte tronqué à '+MAX.toLocaleString('fr-FR')+' caractères.':''}; }
    if(kind==='pdf'){
      try{
        if(!window.pdfjsLib) await loadScript(CDN.pdfjs); window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfworker;
        const pdf = await window.pdfjsLib.getDocument({data:await readBuf(file)}).promise; let out=[]; const n=Math.min(pdf.numPages,80);
        for(let p=1;p<=n;p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); out.push(tc.items.map(i=>i.str).join(' ')); }
        const text=out.join('\n\n').trim();
        if(!text) return {text:'', readable:false, note:'PDF sans texte extractible (scan ou image) : stocké, non analysé (aucun moteur OCR).'};
        return {text:text.slice(0,MAX), readable:true, note:'Texte extrait de '+n+' page(s) via pdf.js.'};
      }catch(e){ return {text:'', readable:false, note:'Lecture du PDF impossible ('+e.message+') : fichier conservé tel quel, non analysé.'}; }
    }
    if(kind==='docx'){
      try{
        if(!window.mammoth) await loadScript(CDN.mammoth);
        const r = await window.mammoth.extractRawText({arrayBuffer:await readBuf(file)});
        return {text:String(r.value||'').slice(0,MAX), readable:!!(r.value&&r.value.trim()), note:'Texte extrait via mammoth.'};
      }catch(e){ return {text:'', readable:false, note:'Lecture du DOCX impossible ('+e.message+') : fichier conservé, non analysé.'}; }
    }
    if(kind==='xlsx'){
      try{
        if(!window.XLSX) await loadScript(CDN.xlsx);
        const wb = window.XLSX.read(await readBuf(file), {type:'array'}); const parts=[];
        wb.SheetNames.slice(0,6).forEach((sn,i)=>{ const csv=window.XLSX.utils.sheet_to_csv(wb.Sheets[sn]); parts.push(i===0?csv:('\n# Feuille : '+sn+'\n'+csv)); });
        return {text:parts.join('\n').slice(0,MAX), readable:true, note:'Feuilles converties en CSV via SheetJS (première feuille analysée).'};
      }catch(e){ return {text:'', readable:false, note:'Lecture du classeur impossible ('+e.message+') : fichier conservé, non analysé.'}; }
    }
    if(kind==='image') return {text:'', readable:false, note:'Image conservée et affichable ; aucune analyse du contenu visuel n’est disponible.'};
    return {text:'', readable:false, note:'Format non pris en charge pour la lecture : fichier conservé tel quel.'};
  },
  thumb(file){
    return new Promise(res=>{
      try{
        const url=URL.createObjectURL(file); const img=new Image();
        img.onload=()=>{ const c=document.createElement('canvas'); const r=Math.min(1,160/Math.max(img.width,img.height)); c.width=Math.max(1,img.width*r); c.height=Math.max(1,img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.7)); };
        img.onerror=()=>{ URL.revokeObjectURL(url); res(''); }; img.src=url;
      }catch(e){ res(''); }
    });
  }
};
const Know = {
  MAX_FILE: 25*1048576,
  async add(file, opts={}){
    if(file.size > this.MAX_FILE) throw new Error('« '+file.name+' » dépasse 25 Mo.');
    const u = await Storage.usage();
    if(u.total + file.size > u.limit) throw new Error('Limite de stockage local atteinte ('+fmtBytes(u.limit)+'). Supprimez des fichiers ou augmentez la limite dans Paramètres.');
    const kind = Readers.kindOf(file); const ex = await Readers.extract(file, kind);
    const meta = {id:uid('fi'), name:file.name, type:file.type||'', kind, size:file.size, folder:opts.folder||'Général', tags:[], note:ex.note, readable:ex.readable, text:ex.text, addedAt:now(), thumb: kind==='image' ? await Readers.thumb(file) : ''};
    const okB = await IDB.put('blobs', {id:meta.id, blob:file}); const okM = await IDB.put('files', meta);
    if(!okB || !okM) throw new Error('Écriture impossible dans le stockage du navigateur.');

  },
  async remove(id){ const i=S.files.findIndex(f=>f.id===id); if(i<0) return; S.files.splice(i,1); await IDB.del('files',id); await IDB.del('blobs',id); S.dirty=true; Bus.emit('files'); },
  update(id, patch){ const f=S.files.find(x=>x.id===id); if(!f) return; Object.assign(f,patch); IDB.put('files',f); Bus.emit('files'); },
  async blob(id){ const r=await IDB.get('blobs',id); return r&&r.blob; },
