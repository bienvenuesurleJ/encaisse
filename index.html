/* ═══════════════════════════════════════════════════════════════════════════
   5. FOURNISSEURS IA (optionnels). Sans clé : moteur local de démonstration.
   ═══════════════════════════════════════════════════════════════════════════ */
const Providers = {
  info:{
    local:{label:'Moteur local de démonstration'},
    claude:{label:'Claude (Anthropic)', url:'https://api.anthropic.com/v1/messages', keyHint:'sk-ant-…'},
    openai:{label:'GPT (OpenAI)', url:'https://api.openai.com/v1/chat/completions', keyHint:'sk-…'},
    custom:{label:'API compatible OpenAI (personnalisée)', keyHint:'clé de votre service'}
  },
  active(){ return S.settings.provider.active; },
  hasKey(p){ return !!Keys[p]; },
  connected(){ const a=this.active(); return a!=='local' && !!Keys[a]; },
  model(p){ p=p||this.active(); return (S.settings.provider[p]&&S.settings.provider[p].model)||''; },
  label(){ const a=this.active(); return this.connected() ? this.info[a].label+(this.model()?' · '+this.model():'') : this.info.local.label; },
  async call({system, user, maxTokens=1800, signal}){
    const p=this.active(); if(!this.connected()) throw new Error('Aucun fournisseur IA connecté.');
    const model=this.model(p); if(!model) throw new Error('Indiquez un nom de modèle dans Paramètres › Fournisseurs IA.');
    const ctl = new AbortController(); const timer=setTimeout(()=>ctl.abort(), 90000);
    if(signal) signal.addEventListener('abort', ()=>ctl.abort());
    try{
      let res, data;
      if(p==='claude'){
        res = await fetch(this.info.claude.url, {method:'POST', signal:ctl.signal, headers:{'content-type':'application/json','x-api-key':Keys.claude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model, max_tokens:maxTokens, system, messages:[{role:'user', content:user}]})});
        data = await res.json().catch(()=>({}));
        if(!res.ok) throw new Error((data.error&&data.error.message)||('Erreur HTTP '+res.status));
        const text=(data.content||[]).map(c=>c.text||'').join('').trim(); if(!text) throw new Error('Réponse vide du modèle.');
        return {text, tin:(data.usage&&data.usage.input_tokens)||estTokens(system+user), tout:(data.usage&&data.usage.output_tokens)||estTokens(text), provider:p, model};
      }
      const url = p==='openai' ? this.info.openai.url : (S.settings.provider.custom.endpoint||'');
      if(!/^https:\/\//i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)/i.test(url)) throw new Error('Adresse d’API invalide (https:// requis).');
      res = await fetch(url, {method:'POST', signal:ctl.signal, headers:{'content-type':'application/json','authorization':'Bearer '+Keys[p]},
        body:JSON.stringify({model, messages:[{role:'system',content:system},{role:'user',content:user}]})});
      data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error((data.error&&(data.error.message||data.error))||('Erreur HTTP '+res.status));
      const text=String(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'').trim(); if(!text) throw new Error('Réponse vide du modèle.');
      return {text, tin:(data.usage&&data.usage.prompt_tokens)||estTokens(system+user), tout:(data.usage&&data.usage.completion_tokens)||estTokens(text), provider:p, model};
    }catch(e){
      if(e.name==='AbortError') throw new Error('Appel interrompu ou délai dépassé.');
      if(e instanceof TypeError) throw new Error('Appel impossible depuis le navigateur : réseau, blocage CORS ou clé invalide. (Voir les limites expliquées dans Paramètres.)');
      throw e;
    } finally { clearTimeout(timer); }
  },
  async test(){
    const r = await this.call({system:'Réponds uniquement par le mot OK.', user:'Test de connexion.', maxTokens:20});
    S.settings.provider[this.active()].verifiedAt = now(); Persist.saveSoon('settings'); return r;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   6. COMMUNICATIONS INTER-AGENTS + ANTI-BOUCLE
   ═══════════════════════════════════════════════════════════════════════════ */
const Comms = {
  send(o){
    const msg = {id:uid('msg'), ts:now(), missionId:o.missionId||null, stepId:o.stepId||null, from:o.from, to:o.to, instructions:o.instructions||'', info:o.info||'', result:o.result||'', status:o.status||'envoyé'};
    S.comms.unshift(msg); IDB.put('comms', msg); S.dirty=true;
    if(S.comms.length>3000){ S.comms.splice(2800).forEach(m=>IDB.del('comms', m.id)); }
    Bus.emit('comms', msg); return msg;
  },
  update(id, patch){ const m=S.comms.find(x=>x.id===id); if(!m) return null; Object.assign(m, patch); IDB.put('comms', m); Bus.emit('comms', m); return m; },
  forMission(mid){ return S.comms.filter(c=>c.missionId===mid).sort((a,b)=>a.ts-b.ts); },
  forAgent(id){ return S.comms.filter(c=>c.from===id||c.to===id); }
};
const Guard = {
  MAX_EXEC:30, MAX_RELAUNCH:5,
  init(m){ if(!m.guard) m.guard={exec:0, sigs:{}, relaunch:{}}; return m.guard; },
  /* un envoi est refusé s'il répète un message identique, ou forme un aller-retour A→B, B→A, A→B */
  checkSend(m, from, to, text){
    const g=this.init(m); const sig=hash(from+'>'+to+'|'+text);
    if(g.sigs[sig]) return {ok:false, reason:'Message identique déjà échangé dans cette mission (répétition évitée).'};
    const last = Comms.forMission(m.id).filter(c=>c.status!=='bloqué').slice(-3);
    if(last.length===3 && last[0].from===from && last[0].to===to && last[1].from===to && last[1].to===from && last[2].from===from && last[2].to===to)
      return {ok:false, reason:'Aller-retour répété entre deux agents (boucle évitée).'};
    g.sigs[sig]=1; return {ok:true};
  },
  checkExec(m){ const g=this.init(m); g.exec++; return g.exec<=this.MAX_EXEC ? {ok:true} : {ok:false, reason:'Limite de '+this.MAX_EXEC+' exécutions atteinte pour cette mission (protection anti-boucle).'}; },
  checkRelaunch(m, stepId){ const g=this.init(m); g.relaunch[stepId]=(g.relaunch[stepId]||0)+1; return g.relaunch[stepId]<=this.MAX_RELAUNCH ? {ok:true} : {ok:false, reason:'Cette tâche a déjà été relancée '+this.MAX_RELAUNCH+' fois : modifiez les instructions ou la mission.'}; }
};


/* ═══════════════════════════════════════════════════════════════════════════
   7. MOTEUR LOCAL DE DÉMONSTRATION
   Règles internes (aucun modèle IA). Les calculs (CSV, texte, calendrier) sont réels ;
   les contenus « méthode » sont les cadres de travail propres à chaque agent.
   Rien n'est inventé sur l'entreprise : ce qui manque est listé « à compléter par vous ».
   ═══════════════════════════════════════════════════════════════════════════ */
const STOP = new Set(('le la les un une des de du dans et en au aux ce cet cette ces que qui quoi dont ou pour par sur avec sans sous plus moins tres pas ne se sa son ses leur leurs nous vous ils elles je tu il elle on mais donc or ni car est sont etre avoir ont ete fait comme aussi cela ca lui y d l qu s n c j m t the of and to in is for with a'
 ).split(' '));
function hasKw(text, kw){
  kw = norm(kw).trim(); if(!kw) return false;
  if(kw.length<=4) return new RegExp('(^|[^a-z0-9])'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(text);
  return text.includes(kw);
}
const TRUTH_BANNER = '> **Moteur local de démonstration** — contenu produit par des règles internes à partir de la méthode de l’agent, **pas par un modèle IA**. Aucune donnée externe n’est consultée et aucun chiffre n’est inventé : ce qui doit venir de vous est marqué ☐.';
const Engine = {
  speed:1,   // 0 = instantané (tests)
  ctxFor(m){
    const files = (m.fileIds||[]).map(id=>S.files.find(f=>f.id===id)).filter(f=>f&&f.readable&&f.text);
    const notes = (m.noteIds||[]).map(id=>S.notes.find(n=>n.id===id)).filter(Boolean);
    return {request:m.request, objective:m.objective, deadline:m.deadline, files, notes, profile:S.profile, extra:m.extra||'', title:m.title};
  },
  firstLines(text, n=3){
    return String(text||'').split('\n').filter(l=>l.trim() && !/^>/.test(l) && !/^#/.test(l)).slice(0,n).map(l=>l.replace(/^[-*]\s+/,'').slice(0,160));
  },
  produce(agent, task, ctx, prev=[]){
    const L=[]; const req = String(ctx.request||'').trim();
    L.push(TRUTH_BANNER, '');
    L.push('## Mission');
    L.push('- **Tâche confiée à '+agent.name+'** ('+agent.role+') : '+task);
    if(ctx.objective) L.push('- **Objectif de la mission** : '+ctx.objective);
    if(req) L.push('- **Demande d’origine** : « '+req.slice(0,300)+(req.length>300?'…':'')+' »');
    if(ctx.extra) L.push('- **Instructions complémentaires de l’utilisateur** : '+ctx.extra);
    if(ctx.deadline) L.push('- **Échéance** : '+fmtDate(ctx.deadline));
    L.push('');
    const p = ctx.profile||{};
    if(p.activity || p.sector || p.goals || p.difficulties){
      L.push('## Contexte renseigné par vous');
      if(p.activity) L.push('- Activité : '+p.activity); if(p.sector) L.push('- Secteur : '+p.sector);
      if(p.goals) L.push('- Objectifs : '+p.goals); if(p.difficulties) L.push('- Difficultés : '+p.difficulties); L.push('');
    }
    L.push('## Éléments reçus');
    if(prev.length) prev.forEach(x=>{ const fl=this.firstLines(x.output,2); L.push('- **De '+x.name+'** ('+x.role+') : '+(fl.join(' · ')||'résultat transmis')); });
    else L.push('- Aucun résultat d’un autre agent : vous êtes le premier maillon de la chaîne.');
    if(ctx.files.length) L.push('- Documents exploités : '+ctx.files.map(f=>'« '+f.name+' »').join(', '));
    if(ctx.notes.length) L.push('- Notes exploitées : '+ctx.notes.map(n=>'« '+n.title+' »').join(', '));
    if(!ctx.files.length && !ctx.notes.length) L.push('- Aucun document ni note de la base de connaissances joint à cette mission.');
    L.push('');
    /* calculs réels éventuels */
    try{
      if(agent.fx==='csv') L.push(...this.fxCsv(ctx));
      else if(agent.fx==='text') L.push(...this.fxText(ctx));
      else if(agent.fx==='calendar') L.push(...this.fxCalendar(agent, ctx));
    }catch(e){ Err.log('engine.fx', e); L.push('## Calculs', '- Le calcul automatique a échoué : '+e.message, ''); }
    /* méthode propre à l'agent */
    (agent.m||[]).forEach(([title, bullets])=>{ L.push('## '+title); bullets.forEach(b=>L.push('- '+b)); L.push(''); });
    /* tableau d'action pour les agents « plan » et « tableau » */
    if(agent.del==='plan' || agent.del==='tableau'){
      L.push('## Tableau d’action');
      L.push('| # | Action | Responsable | Échéance | Statut |','|---|---|---|---|---|');
      let i=1; (agent.m||[]).forEach(([,bullets])=>bullets.slice(0,2).forEach(b=>{ L.push('| '+(i++)+' | '+b.replace(/\|/g,'/')+' | '+agent.name+' / ☐ à confirmer | ☐ à fixer | À faire |'); }));
      L.push('');
    }
    if(agent.del==='script'){
      L.push('## Trame de script à remplir','| Plan | Durée | Image / action | Texte ou voix off |','|---|---|---|---|','| 1 — Accroche | ☐ | ☐ | ☐ |','| 2 — Développement | ☐ | ☐ | ☐ |','| 3 — Preuve | ☐ | ☐ | ☐ |','| 4 — Appel à l’action | ☐ | ☐ | ☐ |','');
    }
    L.push('## À compléter par vous');
    (agent.q||[]).forEach(q=>L.push('- ☐ '+q));
    L.push('');
    if(agent.disclaimer) L.push('> '+agent.disclaimer, '');
    L.push('---','*Livrable de type « '+(DELIVERABLE_KINDS[agent.del]||agent.del)+' » · '+agent.name+' · ton '+agent.tone+'*');
    return L.join('\n');
  },
  /* —— calcul réel : statistiques de base sur les tableaux fournis —— */
  fxCsv(ctx){
    const L=['## Statistiques calculées sur vos données'];
    const tabs = ctx.files.filter(f=>f.kind==='csv'||f.kind==='xlsx');
    if(!tabs.length){ L.push('- Aucun fichier tabulaire (CSV ou XLSX lisible) n’est joint à cette mission : **aucun chiffre n’est calculé**. Importez un fichier dans « Mémoire et connaissances » puis joignez-le à la mission.',''); return L; }
    tabs.forEach(f=>{
      const rows = parseCSV(f.text); if(rows.length<2){ L.push('- « '+f.name+' » : moins de deux lignes exploitables.'); return; }
      const head = rows[0].map((h,i)=>String(h||'').trim()||('Colonne '+(i+1))); const body = rows.slice(1);
      const seen = new Set(); let dup=0; body.forEach(r=>{ const k=r.join('\u0001'); if(seen.has(k)) dup++; else seen.add(k); });
      L.push('', '**Fichier « '+f.name+' »** — '+body.length+' ligne(s), '+head.length+' colonne(s), '+dup+' ligne(s) en doublon.','');
      L.push('| Colonne | Valeurs renseignées | Manquantes | Somme | Moyenne | Médiane | Min | Max |','|---|---|---|---|---|---|---|---|');
      head.slice(0,14).forEach((h,ci)=>{
        const cells = body.map(r=>String(r[ci]??'').trim()); const filled = cells.filter(c=>c!==''); const miss = cells.length-filled.length;
        const nums = filled.map(c=>{ const x=c.replace(/\s|€|%| /g,'').replace(',','.'); return /^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):NaN; });
        const ok = nums.filter(n=>!isNaN(n));
        if(filled.length && ok.length/filled.length>=0.6){
          const s=ok.slice().sort((a,b)=>a-b); const sum=ok.reduce((a,b)=>a+b,0); const med=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;
          L.push('| '+h+' | '+ok.length+' | '+miss+' | '+fmtNum(sum)+' | '+fmtNum(sum/ok.length)+' | '+fmtNum(med)+' | '+fmtNum(s[0])+' | '+fmtNum(s[s.length-1])+' |');
        } else {
          const uniq=new Set(filled).size; L.push('| '+h+' | '+filled.length+' | '+miss+' | — | — | — | '+uniq+' valeurs distinctes | — |');
        }
      });
    });
    L.push('','*Calculs exécutés localement dans votre navigateur sur le contenu exact des fichiers. Limites : aucune correction de données, aucune interprétation causale.*','');
    return L;
  },
  /* —— calcul réel : résumé extractif (phrases du document, non reformulées) —— */
  fxText(ctx){
    const L=['## Lecture des documents et notes'];
    const srcs = [...ctx.files.map(f=>({name:f.name, text:f.text})), ...ctx.notes.map(n=>({name:'Note « '+n.title+' »', text:n.body||''}))].filter(s=>s.text.trim());
    if(!srcs.length){ L.push('- Aucun texte lisible n’est joint : **aucune analyse n’est produite**. (Les PDF scannés, images et formats sans lecteur disponible ne sont pas analysés.)',''); return L; }
    srcs.forEach(s=>{
      const text=s.text; const words=norm(text).split(/[^a-z0-9]+/).filter(w=>w.length>3 && !STOP.has(w) && !/^\d+$/.test(w));
      const freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1);
      const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12);
      const sentences = text.replace(/\s+/g,' ').replace(/([.!?])\s+/g,'$1\n').split('\n').map(x=>x.trim()).filter(x=>x.length>=40 && x.length<=320);
      const scored = sentences.map((x,i)=>{ const ws=norm(x).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)); return {x,i,s:ws.reduce((a,w)=>a+(freq[w]||0),0)/Math.sqrt(ws.length||1)}; });
      const best=scored.sort((a,b)=>b.s-a.s).slice(0,5).sort((a,b)=>a.i-b.i);
      const dates=Array.from(new Set(text.match(/\b(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{4}-\d{2}-\d{2})\b/g)||[])).slice(0,10);
      const amts=Array.from(new Set(text.match(/\b\d[\d\s.,]*\s?(?:€|eur\b|euros?\b|k€|%)/gi)||[])).slice(0,10).map(x=>x.trim());
      L.push('','**'+s.name+'** — '+text.trim().split(/\s+/).length.toLocaleString('fr-FR')+' mots, '+sentences.length+' phrases détectées.');
      if(top.length) L.push('- Termes les plus fréquents : '+top.map(([w,c])=>w+' ('+c+')').join(', '));
      if(best.length){ L.push('- Phrases les plus représentatives (extraites telles quelles, sans reformulation) :'); best.forEach(b=>L.push('  - « '+b.x+' »')); }
      L.push('- Dates repérées : '+(dates.join(', ')||'aucune')); L.push('- Montants et pourcentages repérés : '+(amts.join(', ')||'aucun'));
    });
    L.push('','*Méthode : comptage de fréquences et sélection de phrases, exécutés localement. Ce n’est pas une compréhension du texte : à vérifier par une lecture humaine.*','');
    return L;
  },
  /* —— calcul réel : calendrier daté (le contenu reste à définir) —— */
  fxCalendar(agent, ctx){
    const L=['## Calendrier daté']; const start=new Date(); start.setHours(0,0,0,0);
    let d=new Date(start); d.setDate(d.getDate()+((8-d.getDay())%7||7)); // prochain lundi
    const end = ctx.deadline ? new Date(ctx.deadline) : new Date(d.getTime()+28*86400000);
    const jours=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi']; const rows=[]; let n=0;
    const pillars=['Conseil','Coulisses','Preuve client','Offre','Actualité'];
    if(agent.id==='AG-06'){ // publications : lundi, mercredi, vendredi
      for(let t=new Date(d); t<=end && rows.length<36; t.setDate(t.getDate()+1)){ if([1,3,5].includes(t.getDay())){ rows.push('| '+fmtDate(t.getTime())+' | '+jours[t.getDay()]+' | '+pillars[n%pillars.length]+' | ☐ sujet à définir | ☐ réseau |'); n++; } }
      L.push('| Date | Jour | Pilier suggéré | Contenu | Canal |','|---|---|---|---|---|');
    } else if(agent.id==='AG-34'){ // périodes de deux semaines
      for(let t=new Date(d); t<=end && rows.length<8; t.setDate(t.getDate()+14)){ const e=new Date(t.getTime()+13*86400000); rows.push('| Période '+(rows.length+1)+' | '+fmtDate(t.getTime())+' → '+fmtDate(e.getTime())+' | ☐ résultat clé visé | ☐ responsable |'); }
      L.push('| Période | Dates | Objectif | Responsable |','|---|---|---|---|');
    } else { // jalons hebdomadaires
      for(let t=new Date(d); t<=end && rows.length<12; t.setDate(t.getDate()+7)){ rows.push('| Semaine '+(rows.length+1)+' | '+fmtDate(t.getTime())+' | ☐ jalon à définir | ☐ responsable | À faire |'); }
      L.push('| Semaine | Début | Jalon | Responsable | Statut |','|---|---|---|---|---|');
    }
    L.push(...rows,'','*Les dates sont calculées à partir d’aujourd’hui'+(ctx.deadline?' et de l’échéance de la mission':' (horizon de quatre semaines, sans échéance fixée)')+'. Les contenus et responsables restent à décider.*','');
    return L;
  },
  /* —— discussion individuelle —— */
  chatReply(agent, text, ctx){
    const t = norm(text); const head='*Réponse du moteur local de démonstration (règles internes, pas un modèle IA).*\n\n';
    if(/\b(bonjour|salut|coucou|hello|bonsoir)\b/.test(t)) return {text:head+'Bonjour, je suis **'+agent.name+'**, '+agent.role.toLowerCase()+'. Je travaille avec une méthode précise (« '+(agent.m[0]&&agent.m[0][0]||'méthode')+' », etc.). Demandez-moi de **préparer** ou **proposer** quelque chose pour obtenir un livrable structuré.'};
    if(/(qui es.tu|presente|ton role|que fais.tu|competence|tu sais faire|metier)/.test(t)) return {text:head+'**'+agent.name+'** — '+agent.role+'\n\n'+agent.desc+'\n\n**Compétences** : '+agent.skills.join(', ')+'.'};
    if(/(question|besoin de quoi|quoi te donner|informations? .*(faut|utile)|que dois)/.test(t)) return {text:head+'Pour bien travailler, j’ai besoin de :\n'+(agent.q||[]).map(q=>'- '+q).join('\n')};
    if(/(fais|fait|prepare|redige|propose|ecris|cree|etablis|construis|genere|plan |liste|analyse|aide)/.test(t)){
      return {text:this.produce(agent, text.slice(0,200), ctx||{request:text, files:[], notes:[], profile:S.profile}, []), canSave:true};
    }
    return {text:head+'Je ne comprends pas le langage libre : je réponds à des demandes du type « prépare… », « propose… », « analyse… » en appliquant ma méthode. Demandez-moi aussi « tes compétences » ou « de quoi as-tu besoin ». Pour des réponses réellement générées par un modèle, connectez un fournisseur IA dans Paramètres.'};
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   8. MISSIONS · DIRECTEUR IA · EXÉCUTEUR
   ═══════════════════════════════════════════════════════════════════════════ */
const mkStep = (agentId, task) => ({id:uid('st'), agentId, task, status:'à faire', output:'', docId:null, engine:'', startedAt:0, endedAt:0, error:'', history:[]});
const Missions = {
  get(id){ return S.missions.find(m=>m.id===id)||null; },
  create(o){
    const m = Object.assign({id:uid('mi'), title:'Mission', request:'', objective:'', status:'À planifier', priority:'Normale', deadline:null, steps:[], subtasks:[], log:[], fileIds:[], noteIds:[], source:'manuel', createdAt:now(), updatedAt:now(), extra:'', synthesisDocId:null, plan:null, guard:null}, o);
    S.missions.unshift(m); this.addLog(m,'Mission créée ('+m.source+').'); this.touch(m); logAct('mission','Mission créée : '+m.title, m.id); return m;
  },
  touch(m){ m.updatedAt=now(); Persist.saveSoon('missions'); S.dirty=true; Bus.emit('missions', m); },
  addLog(m,text){ m.log.push({ts:now(), text}); if(m.log.length>200) m.log.shift(); },
  progress(m){
    const real=m.steps.filter(s=>s.status!=='ignoré');
    if(real.length) return Math.round(100*real.filter(s=>s.status==='terminé').length/real.length);
    if(m.subtasks.length) return Math.round(100*m.subtasks.filter(t=>t.done).length/m.subtasks.length);
    return m.status==='Terminée'?100:0;
  },
  agentIds(m){ return Array.from(new Set(m.steps.map(s=>s.agentId))); },
  async remove(id){ const m=this.get(id); if(!m) return; Runner.stop(id); S.missions=S.missions.filter(x=>x.id!==id); Persist.saveSoon('missions'); logAct('mission','Mission supprimée : '+m.title); Bus.emit('missions'); },
  setStatus(m, st, note){ m.status=st; this.addLog(m, note||('Statut → '+st)); this.touch(m); },
  resetAgents(m){ Object.keys(S.agentState).forEach(id=>{ const s=S.agentState[id]; if(s.missionId===m.id && ['mission','reflexion','collab','attente','erreur'].includes(s.status)) Agents.setStatus(id,'dispo',null); }); }
};

const DEPT_ORDER = ['strategie','recherche','analyse','direction','marketing','commercial','prospection','communication','creation','production','technologie','developpement','securite','finance','administration','rh','service-client'];
const NUMWORDS = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10};
const Director = {
  analyse(request){
    const t = norm(request);
    let best=null, sc=0;
    PLAYBOOKS.forEach(p=>{ let s=0; p.kw.forEach(k=>{ if(hasKw(t,k)) s+=norm(k).length; }); if(s>sc){ sc=s; best=p; } });
    const scores = Agents.active().map(a=>{ let s=0; (a.kw||[]).forEach(k=>{ if(hasKw(t,k)) s+=norm(k).length>5?2:1; }); (a.skills||[]).forEach(k=>{ if(hasKw(t,k)) s+=1; }); return {a, s}; }).filter(x=>x.s>0).sort((x,y)=>y.s-x.s);
    let top=null; const m = t.match(/\b(\d{1,2}|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix)\s+(?:\w+\s+)?(?:ameliorations?|idees?|pistes?|actions?|points?|recommandations?|axes?)/);
    if(m) top = NUMWORDS[m[1]] || parseInt(m[1],10);
    return {playbook:best, playbookScore:sc, agentScores:scores, top, text:t};
  },
  /* Construit un plan : chaîne séquentielle d'étapes, chacune confiée à un agent actif */
  plan(request, opts={}){
    const an = this.analyse(request); const notes=[]; const steps=[]; let objective, label;
    const hasCsv = (opts.fileIds||[]).some(id=>{ const f=S.files.find(x=>x.id===id); return f && f.readable && (f.kind==='csv'||f.kind==='xlsx'); });
    if(an.playbook){
      label = an.playbook.label; objective = an.playbook.objective;
      an.playbook.steps.forEach(([aid, task, cond])=>{
        if(cond==='csv' && !hasCsv){ notes.push('Étape « '+task+' » ignorée : aucun tableau CSV/XLSX lisible n’est joint.'); return; }
        let ag = Agents.get(aid);
        if(!ag || !Agents.canReceive(aid)){
          const sub = ag ? Agents.byDept(ag.dept).find(x=>x.id!==aid && Agents.canReceive(x.id)) : null;
          if(sub){ notes.push((ag?ag.name:aid)+' est indisponible (désactivé) : remplacé par '+sub.name+'.'); ag=sub; } else { notes.push((ag?ag.name:aid)+' est désactivé et sans remplaçant : étape « '+task+' » ignorée.'); return; }
        }
        steps.push(mkStep(ag.id, task));
      });
    } else if(an.agentScores.length){
      label = 'Sélection par compétences'; objective = 'Traiter la demande avec les agents dont les compétences correspondent';
      const chosen = an.agentScores.filter(x=>Agents.canReceive(x.a.id)).slice(0,4).map(x=>x.a).sort((a,b)=>DEPT_ORDER.indexOf(a.dept)-DEPT_ORDER.indexOf(b.dept));
      chosen.forEach(a=>steps.push(mkStep(a.id, 'Traiter la demande selon votre domaine ('+a.skills.slice(0,2).join(', ')+')')));
      notes.push('Aucun scénario type ne correspond : agents choisis d’après les mots de votre demande.');
    } else {
      label = 'Cadrage général'; objective = 'Cadrer la demande, car aucun domaine précis n’a été reconnu';
      ['AG-01','AG-33'].forEach((id,i)=>{ if(Agents.canReceive(id)) steps.push(mkStep(id, i===0?'Clarifier l’objectif et les priorités de la demande':'Proposer un diagnostic et des options à partir de la demande')); });
      notes.push('Votre demande ne correspond à aucun domaine connu : un cadrage est proposé. Reformulez avec plus de précision pour une équipe mieux adaptée.');
    }
    return {label, objective, steps, notes, top:an.top, sourceRule: an.playbook?('scénario « '+an.playbook.label+' »'):'compétences'};
  },
  createMission(request, opts={}){
    request = String(request||'').trim();
    const pl = this.plan(request, opts);
    if(!pl.steps.length) return {error:'Aucun agent actif ne peut traiter cette demande. Activez des agents dans « Équipe ».'};
    let fileIds = opts.fileIds||[];
    if(!fileIds.length && opts.auto && /document|fichier|analys/.test(norm(request))) fileIds = Know.readable().map(f=>f.id);
    const title = (opts.title || (request.length>64 ? request.slice(0,61)+'…' : request)) || pl.label;
    const m = Missions.create({title, request, objective:pl.objective+(pl.top?(' — '+pl.top+' pistes demandées'):''), steps:pl.steps, priority:opts.priority||'Normale', deadline:opts.deadline||null, fileIds, noteIds:opts.noteIds||[], source:opts.source||'directeur', status:'À planifier',
      plan:{label:pl.label, notes:pl.notes, top:pl.top, rule:pl.sourceRule, engine:'règles locales'}});
    Missions.addLog(m, 'Plan établi par le directeur ('+pl.sourceRule+') : '+pl.steps.map(s=>(Agents.get(s.agentId)||{}).name).join(' → ')+'.');
    pl.notes.forEach(n=>Missions.addLog(m,n)); Missions.touch(m);
    return {mission:m, plan:pl};
  },
  /* Vérification du directeur : contrôles réels sur les livrables (présence, longueur, éléments restant à compléter) */
  verify(m){
    const checks=[]; let todo=0;
    m.steps.forEach(s=>{
      const a=Agents.get(s.agentId)||{name:s.agentId};
      if(s.status==='ignoré'){ checks.push({ok:null, text:a.name+' : étape ignorée.'}); return; }
      if(s.status!=='terminé' || !s.output){ checks.push({ok:false, text:a.name+' : aucun livrable produit.'}); return; }
      const out=s.output; const n=(out.match(/☐/g)||[]).length; todo+=n;
      const issues=[]; if(out.length<400) issues.push('livrable très court'); if(/undefined|NaN|\[object/.test(out)) issues.push('valeur invalide détectée');
      if(!/^#{2}\s/m.test(out) && s.engine && /local/i.test(s.engine)) issues.push('structure absente');
      checks.push({ok:issues.length===0, text:a.name+' : '+(issues.length?issues.join(', '):'livrable présent et structuré')+(n?' — '+n+' élément(s) à compléter par vous':'' )});
    });
    return {checks, todo};
  },
  synthesis(m, extraNote){
    const v=this.verify(m); const L=[]; const local = m.steps.some(s=>/local/i.test(s.engine||''));
    L.push(local ? TRUTH_BANNER : '> Synthèse assemblée par NEXORA AI à partir des livrables ci-dessous. Les contenus produits par un modèle sont à relire avant usage.','');
    L.push('## Objectif','- '+(m.objective||m.title)); if(m.request) L.push('- Demande : « '+m.request.slice(0,300)+' »'); L.push('');
    L.push('## Plan suivi','| # | Agent | Tâche | Statut |','|---|---|---|---|');
    m.steps.forEach((s,i)=>{ const a=Agents.get(s.agentId)||{name:s.agentId,role:''}; L.push('| '+(i+1)+' | '+a.name+' — '+a.role+' | '+s.task.replace(/\|/g,'/')+' | '+s.status+' |'); }); L.push('');
    if(m.plan&&m.plan.top){
      L.push('## '+m.plan.top+' pistes à instruire','> Ce sont des **axes de travail issus des méthodes des agents**, pas des constats sur votre entreprise : le moteur local ne connaît pas vos chiffres.');
      m.steps.filter(s=>s.status==='terminé').slice(0,m.plan.top).forEach((s,i)=>{ const a=Agents.get(s.agentId); const mm=a&&a.m&&a.m[0]; L.push((i+1)+'. **'+a.role+'** — '+(mm?mm[1][0]:'voir le livrable')); }); L.push('');
    }
    L.push('## Points clés par agent');
    m.steps.filter(s=>s.status==='terminé').forEach(s=>{ const a=Agents.get(s.agentId); const heads=(s.output.match(/^## .+$/gm)||[]).filter(h=>!/Mission|Éléments|Contexte|À compléter|Tableau|Calendrier|Statistiques|Lecture/.test(h)).slice(0,3).map(h=>h.replace(/^## /,''));
      L.push('- **'+a.name+'** ('+a.role+') : '+(heads.join(' · ')||'voir le livrable détaillé')); }); L.push('');
    L.push('## Vérifications du directeur'); v.checks.forEach(c=>L.push('- '+(c.ok===true?'✔':c.ok===false?'⚠':'–')+' '+c.text)); L.push('');
    const qs=[]; m.steps.forEach(s=>{ const a=Agents.get(s.agentId); (a&&a.q||[]).slice(0,2).forEach(q=>{ if(!qs.includes(q)) qs.push(q); }); });
    L.push('## Prochaines actions (à vous)'); qs.slice(0,8).forEach(q=>L.push('- ☐ '+q)); L.push('');
    L.push('## Limites','- '+(local?'Les livrables viennent du moteur local de démonstration : ils appliquent des méthodes, ils n’analysent pas votre situation.':'Les contenus générés par un modèle peuvent contenir des erreurs : relisez-les avant tout usage.'),'- Aucune action externe n’a été exécutée (aucun envoi, publication ni achat).'); if(extraNote) L.push('- '+extraNote);
    return {content:L.join('\n'), todo:v.todo};
  }
};

const Runner = {
  live:{},
  isRunning(mid){ return !!this.live[mid]; },
  _wait(ms, run){ return new Promise(res=>{ if(ms<=0||Engine.speed===0) return res(); let t=0; const iv=setInterval(()=>{ t+=60; if(run.stop||t>=ms*Engine.speed){ clearInterval(iv); res(); } },60); }); },
  stop(mid){ const r=this.live[mid]; if(!r) return false; r.stop=true; if(r.ctl) try{ r.ctl.abort(); }catch(e){} return true; },
  stopAll(){ Object.keys(this.live).forEach(id=>this.stop(id)); },
  prevOutputs(m, upto){ return m.steps.slice(0,upto).filter(s=>s.status==='terminé'&&s.output).map(s=>{ const a=Agents.get(s.agentId)||{name:s.agentId,role:''}; return {name:a.name, role:a.role, output:s.output, agentId:s.agentId}; }); },
  async start(mid){
    const m=Missions.get(mid); if(!m || this.live[mid]) return false;
    if(!m.steps.length){ toast('Cette mission n’a aucune étape : ajoutez un agent.','warn'); return false; }
    const run=this.live[mid]={stop:false, ctl:null}; let failed=false;
    Missions.setStatus(m,'En cours','Exécution lancée.'); m.interrupted=false; m.startedAt=m.startedAt||now(); m.guard=m.guard||null;
    Agents.setStatus('DIR','reflexion',m.id); await this._wait(500, run);
    try{
      for(let i=0;i<m.steps.length;i++){
        const s=m.steps[i]; if(run.stop) break;
        if(s.status==='terminé'||s.status==='ignoré') continue;
        const ok = await this.execStep(m, i, run); if(!ok){ failed=true; break; }
      }
      Missions.resetAgents(m);
      const dirMsg = txt => { if(m.source==='directeur') Chat.push('DIR',{role:'ai', text:txt, missionId:m.id}); };
      if(run.stop){ Missions.setStatus(m,'En attente','Mission interrompue par l’utilisateur.'); m.steps.forEach(s=>{ if(s.status==='en cours') s.status='à faire'; }); toast('Mission interrompue : '+m.title,'warn'); dirMsg('Mission **interrompue**. Les étapes terminées sont conservées ; vous pouvez modifier les instructions puis relancer.'); }
      else if(failed){ const bad=m.steps.find(s=>s.status==='erreur'); Missions.setStatus(m,'Échouée','Mission arrêtée sur une erreur.'); logAct('erreur','Mission échouée : '+m.title, m.id); toast('La mission a rencontré une erreur.','err'); dirMsg('La mission s’est **arrêtée sur une erreur**'+(bad?' ('+whoName(bad.agentId)+' : '+bad.error+')':'')+'. Corrigez la cause puis relancez l’étape concernée.'); }
      else await this.finish(m, run);
    }catch(e){ Err.log('runner', e); Missions.resetAgents(m); Missions.setStatus(m,'Échouée','Erreur interne : '+e.message); }
    finally{ delete this.live[mid]; Agents.setStatus('DIR','dispo',null); Missions.touch(m); Persist.flush(); }
    return true;
  },
  async execStep(m, i, run){
    const s=m.steps[i]; const a=Agents.get(s.agentId);
    const g=Guard.checkExec(m); if(!g.ok){ s.status='erreur'; s.error=g.reason; Missions.addLog(m,g.reason); return false; }
    if(!a || !Agents.canReceive(a.id)){ s.status='ignoré'; s.error='Agent désactivé ou sans autorisation de recevoir des missions.'; Missions.addLog(m,(a?a.name:s.agentId)+' ne peut pas recevoir de mission : étape ignorée.'); Missions.touch(m); return true; }
    const prev=this.prevOutputs(m,i); const sender = prev.length ? prev[prev.length-1].agentId : 'DIR';
    const info = prev.length ? prev.map(p=>p.name+' : '+(Engine.firstLines(p.output,2).join(' · '))).join('\n') : 'Demande d’origine : '+(m.request||m.title);
    const instr = s.task+(m.extra?'\nInstructions complémentaires : '+m.extra:'');
    s.attempt=(s.attempt||0)+1; const chk = Guard.checkSend(m, sender, a.id, instr+'|'+info.slice(0,200)+'|'+s.attempt);
    if(!chk.ok){ Comms.send({missionId:m.id, stepId:s.id, from:sender, to:a.id, instructions:instr, info:'', result:chk.reason, status:'bloqué'}); s.status='erreur'; s.error=chk.reason; Missions.addLog(m,chk.reason); return false; }
    const comm = Comms.send({missionId:m.id, stepId:s.id, from:sender, to:a.id, instructions:instr, info, status:'envoyé'});
    s.status='en cours'; s.startedAt=now(); s.error=''; Missions.touch(m);
    if(sender!=='DIR') Agents.setStatus(sender,'collab',m.id); Agents.setStatus('DIR','collab',m.id);
    Agents.setStatus(a.id,'collab',m.id); await this._wait(650, run); if(run.stop) { Comms.update(comm.id,{status:'interrompu'}); return true; }
    Agents.setStatus('DIR','mission',m.id); if(sender!=='DIR') Agents.setStatus(sender,'dispo',null);
    Agents.setStatus(a.id,'reflexion',m.id); Comms.update(comm.id,{status:'en traitement'}); await this._wait(500, run); if(run.stop){ Comms.update(comm.id,{status:'interrompu'}); return true; }
    Agents.setStatus(a.id,'mission',m.id);
    const ctx=Engine.ctxFor(m); let text='', engine='', tin=0, tout=0, src='local';
    try{
      if(Providers.connected()){
        run.ctl=new AbortController();
        const sys=a.instr+'\nRègles : réponds en français et en Markdown (titres ##, listes). N’invente aucun chiffre ni fait sur l’entreprise : signale ce qui manque avec « ☐ ». Si tu n’as pas assez d’informations, dis-le. Tu n’exécutes aucune action externe.';
        const know=[...ctx.files.map(f=>'### Document « '+f.name+' »\n'+f.text.slice(0,12000)), ...ctx.notes.map(n=>'### Note « '+n.title+' »\n'+(n.body||'').slice(0,4000))].join('\n\n');
        const profile=['activity','sector','goals','difficulties'].filter(k=>S.profile[k]).map(k=>k+' : '+S.profile[k]).join('\n');
        const user='Mission : '+m.title+'\nObjectif : '+(m.objective||'')+'\nDemande : '+m.request+'\n'+(m.extra?'Instructions complémentaires : '+m.extra+'\n':'')+(profile?'\nContexte utilisateur :\n'+profile+'\n':'')+'\nTa tâche : '+s.task+'\n'+(prev.length?'\nTravaux des collègues :\n'+prev.map(p=>'## '+p.name+' ('+p.role+')\n'+p.output.slice(0,5000)).join('\n\n'):'')+(know?'\n\nConnaissances disponibles :\n'+know:'');
        const r=await Providers.call({system:sys, user, maxTokens:2400, signal:undefined}); run.ctl=null;
        if(run.stop){ Comms.update(comm.id,{status:'interrompu'}); return true; }
        text=r.text; engine=Providers.info[r.provider].label+' · '+r.model; tin=r.tin; tout=r.tout; src='model';
        text='> Contenu généré par **'+engine+'** — à relire avant usage.\n\n'+text;
      } else {
        await this._wait(300, run); if(run.stop){ Comms.update(comm.id,{status:'interrompu'}); return true; }
        text=Engine.produce(a, s.task, ctx, prev); engine='Moteur local de démonstration'; tin=estTokens(instr+info); tout=estTokens(text);
      }
    }catch(e){
      run.ctl=null; if(run.stop){ Comms.update(comm.id,{status:'interrompu'}); return true; }
      s.status='erreur'; s.error=e.message; Comms.update(comm.id,{status:'erreur', result:e.message}); Agents.setStatus(a.id,'erreur',m.id); a&&Agents.state(a.id).stats&&Agents.state(a.id).stats.failed++;
      Missions.addLog(m, a.name+' : erreur — '+e.message); Missions.touch(m); return false;
    }
    Usage.add({tin,tout,source:src}); Agents.state(a.id).stats.done++; Agents.state(a.id).stats.tokens+=tin+tout;
    if(s.output) s.history.push({ts:s.endedAt||now(), output:s.output, engine:s.engine});
    s.output=text; s.engine=engine; s.status='terminé'; s.endedAt=now(); s.error='';
    const doc = s.docId && Docs.get(s.docId) ? Docs.update(s.docId,{content:text, title:a.name+' — '+s.task.slice(0,70)}) : Docs.create({title:a.name+' — '+s.task.slice(0,70), kind:a.del, content:text, missionId:m.id, agentId:a.id, source:'agent', engine});
    s.docId=doc.id; Agents.remember(a.id, 'Mission « '+m.title+' » : '+s.task, m.id);
    Comms.update(comm.id,{status:'terminé', result:Engine.firstLines(text,2).join(' · ')||'Livrable produit'});
    Agents.setStatus(a.id,'termine',m.id); logAct('livrable', a.name+' a livré : '+s.task.slice(0,60), m.id);
    Missions.touch(m); await this._wait(350, run); return true;
  },
  async finish(m, run){
    Agents.setStatus('DIR','reflexion',m.id); await this._wait(500, run);
    const v=Director.synthesis(m); let content=v.content; let engine='Moteur local de démonstration';
    if(Providers.connected()){
      try{
        const r=await Providers.call({system:'Tu es le directeur IA. À partir des livrables fournis, rédige une synthèse en français (Markdown) : objectif, résultats clés, points de vigilance, prochaines actions. N’invente aucun fait.', user:'Mission : '+m.title+'\n'+m.steps.filter(s=>s.output).map(s=>'## '+(Agents.get(s.agentId)||{}).name+'\n'+s.output.slice(0,4000)).join('\n\n'), maxTokens:1800});
        Usage.add({tin:r.tin,tout:r.tout,source:'model'}); engine=Providers.info[r.provider].label+' · '+r.model; content='> Synthèse générée par **'+engine+'**, complétée des contrôles du directeur ci-dessous.\n\n'+r.text+'\n\n'+content.split('## Vérifications du directeur')[1].split('## Prochaines')[0].replace(/^/,'## Vérifications du directeur');
      }catch(e){ Missions.addLog(m,'Synthèse par le modèle impossible ('+e.message+') : synthèse locale utilisée.'); }
    } else Usage.add({tin:estTokens(m.request),tout:estTokens(content),source:'local'});
    const doc = m.synthesisDocId && Docs.get(m.synthesisDocId) ? Docs.update(m.synthesisDocId,{content}) : Docs.create({title:'Synthèse — '+m.title, kind:'synthese', content, missionId:m.id, agentId:'DIR', source:'directeur', engine});
    m.synthesisDocId=doc.id; m.finishedAt=now();
    const auto=S.settings.autonomy==='autonome' && m.source!=='manuel-valide';
    Comms.send({missionId:m.id, from:'DIR', to:'USER', instructions:'Remise de la synthèse', info:m.steps.length+' livrable(s)', result:'Synthèse disponible : '+doc.title, status:'terminé'});
    Missions.resetAgents(m);
    Missions.setStatus(m, auto?'Terminée':'En validation', auto?'Mission terminée (autonomie : autonome). Synthèse prête.':'Synthèse prête : en attente de votre validation.');
    if(m.source==='directeur') Chat.push('DIR',{role:'ai', missionId:m.id, docId:doc.id, text:'Mission **'+m.title+'** : tous les livrables sont prêts. '+(auto?'':'Elle attend votre validation. ')+(v.todo?v.todo+' élément(s) restent à compléter par vous (marqués ☐). ':'')+'La synthèse récapitule le plan, les points clés et mes vérifications.'});
    logAct('mission','Mission '+(auto?'terminée':'à valider')+' : '+m.title, m.id); toast('Mission '+(auto?'terminée':'prête à valider')+' : '+m.title,'ok');
    if(v.todo) Missions.addLog(m, v.todo+' élément(s) restent à compléter par vous.');
  },
  /* Relance d'une étape : les étapes suivantes sont aussi relancées car elles dépendent de son résultat */
  async relaunchStep(mid, stepId){
    const m=Missions.get(mid); if(!m || this.live[mid]) return false;
    const idx=m.steps.findIndex(s=>s.id===stepId); if(idx<0) return false;
    const g=Guard.checkRelaunch(m, stepId); if(!g.ok){ toast(g.reason,'err'); return false; }

    m.guard.sigs={}; Missions.addLog(m,'Relance depuis l’étape '+(idx+1)+'.'); Missions.touch(m); return this.start(mid);
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   8c. TRADING : SIMULATION UNIQUEMENT — aucune transaction réelle, aucun cours réel inventé
   ═══════════════════════════════════════════════════════════════════════════ */
const Trading = {
  /* PRNG déterministe : les séries « synthétiques » sont reproductibles et clairement étiquetées */
  rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; },
  synthetic(seed=42, n=400, vol=1.4, drift=0.03){
    const r=this.rng(seed); const close=[]; const dates=[]; let p=100; const d0=new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate()-n);
    for(let i=0;i<n;i++){ const u1=Math.max(r(),1e-9), u2=r(); const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); p=Math.max(1, p*(1+(drift+vol*z)/100)); close.push(Math.round(p*100)/100); const d=new Date(d0); d.setDate(d0.getDate()+i); dates.push(dayKey(d.getTime())); }
    return {name:'Série synthétique (graine '+seed+')', kind:'synthetique', seed, dates, close};
  },
  importCsv(text, name){
    const rows=parseCSV(text); if(rows.length<20) throw new Error('Au moins 20 lignes de données sont nécessaires.');
    const head=rows[0].map(h=>norm(h)); const num=s=>{ const x=String(s||'').replace(/\s|€|\$| /g,'').replace(',','.'); return /^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):NaN; };
    let ci=head.findIndex(h=>/^(adj close|close|cloture|clôture|dernier|last|cours|price|prix)$/.test(h)); if(ci<0) ci=head.findIndex(h=>/close|clot|cours|prix|price/.test(h));
    if(ci<0){ ci=head.length-1; }
    const di=head.findIndex(h=>/date|jour|time|day/.test(h));
    const close=[], dates=[]; rows.slice(1).forEach((r,i)=>{ const v=num(r[ci]); if(!isNaN(v) && v>0){ close.push(v); dates.push(di>=0?String(r[di]).slice(0,10):'#'+(i+1)); } });
    if(close.length<20) throw new Error('Colonne de cours introuvable ou trop peu de valeurs numériques (colonne utilisée : « '+rows[0][ci]+' »).');
    if(close.length>5000){ close.splice(0, close.length-5000); dates.splice(0, dates.length-5000); }
    return {name:name||'Données importées', kind:'import', column:rows[0][ci], dates, close};
  },
  sma(a,n){ const out=new Array(a.length).fill(null); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n) s-=a[i-n]; if(i>=n-1) out[i]=s/n; } return out; },
  signals(close,p){
    const n=close.length, sig=new Array(n).fill(0);
    if(p.strategy==='sma'){ const f=this.sma(close,p.fast), s=this.sma(close,p.slow); for(let i=1;i<n;i++){ if(f[i]==null||s[i]==null||f[i-1]==null||s[i-1]==null) continue; if(f[i-1]<=s[i-1]&&f[i]>s[i]) sig[i]=1; else if(f[i-1]>=s[i-1]&&f[i]<s[i]) sig[i]=-1; } }
    else if(p.strategy==='breakout'){ for(let i=p.slow;i<n;i++){ const hi=Math.max(...close.slice(i-p.slow,i)); const lo=Math.min(...close.slice(Math.max(0,i-p.fast),i)); if(close[i]>hi) sig[i]=1; else if(close[i]<lo) sig[i]=-1; } }
    else { for(let i=p.slow;i<n;i++){ const w=close.slice(i-p.slow,i); const m=w.reduce((a,b)=>a+b,0)/w.length; const sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/w.length)||1e-9; const z=(close[i]-m)/sd; if(z<-2) sig[i]=1; else if(z>0) sig[i]=-1; } }
    return sig;
  },
  backtest(series, p){
    const close=series.close, n=close.length, fee=(p.feePct||0)/100; const sig=this.signals(close,p);
    let cash=p.capital, pos=null, pendIn=false, pendOut=false; const trades=[], equity=[];
    for(let i=0;i<n;i++){
      const price=close[i];
      if(pos && pendOut){ cash+=pos.qty*price*(1-fee); trades.push({entryI:pos.i, exitI:i, entryDate:series.dates[pos.i], exitDate:series.dates[i], entry:pos.entry, exit:price, qty:pos.qty, pnl:pos.qty*price*(1-fee)-pos.cost, why:pos.why}); pos=null; pendOut=false; }
      else if(!pos && pendIn){ const stopDist=price*p.stopPct/100; let qty=(cash*p.riskPct/100)/stopDist; qty=Math.min(qty, cash/(price*(1+fee))); if(qty>0){ const cost=qty*price*(1+fee); cash-=cost; pos={qty, entry:price, i, cost, stop:price*(1-p.stopPct/100), tp:price*(1+p.takeProfitPct/100), why:'signal'}; } pendIn=false; }
      if(pos){ if(price<=pos.stop){ pos.why='stop'; pendOut=true; } else if(price>=pos.tp){ pos.why='objectif'; pendOut=true; } else if(sig[i]===-1){ pos.why='signal'; pendOut=true; } }
      else if(sig[i]===1) pendIn=true;
      equity.push(cash+(pos?pos.qty*price:0));
    }
    if(pos){ const price=close[n-1]; cash+=pos.qty*price*(1-fee); trades.push({entryI:pos.i, exitI:n-1, entryDate:series.dates[pos.i], exitDate:series.dates[n-1], entry:pos.entry, exit:price, qty:pos.qty, pnl:pos.qty*price*(1-fee)-pos.cost, why:'fin de série'}); equity[n-1]=cash; }
    let peak=-Infinity, mdd=0; equity.forEach(e=>{ peak=Math.max(peak,e); mdd=Math.max(mdd,(peak-e)/peak); });
    const wins=trades.filter(t=>t.pnl>0), loss=trades.filter(t=>t.pnl<=0); const gp=wins.reduce((a,t)=>a+t.pnl,0), gl=-loss.reduce((a,t)=>a+t.pnl,0);
    return {trades, equity, stats:{n:trades.length, winRate:trades.length?wins.length/trades.length:0, pnl:cash-p.capital, ret:(cash-p.capital)/p.capital, maxDD:mdd, profitFactor:gl>0?gp/gl:(gp>0?Infinity:0), avgWin:wins.length?gp/wins.length:0, avgLoss:loss.length?-gl/loss.length:0, buyHold:(close[n-1]/close[0]-1), final:cash}};
  },
  /* calculateur de risque : taille de position à partir du risque accepté */
  sizing(capital, riskPct, entry, stop){ const risk=capital*riskPct/100; const dist=Math.abs(entry-stop); if(!(dist>0)||!(entry>0)) return null; const qty=risk/dist; return {risk, qty, notional:qty*entry, pctCapital:qty*entry/capital*100}; }
};

/* —— toasts —— */
function toast(msg, kind='info', ms=3800){
  const root=$('#toast-root'); if(!root) return; const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg; root.appendChild(el);
  while(root.children.length>4) root.firstChild.remove(); setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); }, ms);
}

/* —— préservation de saisie pendant les rafraîchissements d'arrière-plan —— */
function snapUI(root){
  const st={}; $$('input[id],textarea[id],select[id]', root).forEach(el=>{ st[el.id]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value; });
  const ae=document.activeElement; st.__f=(ae&&ae.id&&root.contains(ae))?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const sc=$$('[data-keepscroll]',root).map(e=>[e.dataset.keepscroll,e.scrollTop]); st.__sc=sc; return st;
}
function restoreUI(root, st){
  Object.keys(st).forEach(k=>{ if(k.startsWith('__')) return; const el=document.getElementById(k); if(!el||!root.contains(el)) return; if(el.type==='checkbox'||el.type==='radio') el.checked=st[k]; else if(el.value!==st[k]) el.value=st[k]; });
  (st.__sc||[]).forEach(([k,v])=>{ const el=$('[data-keepscroll="'+k+'"]',root); if(el) el.scrollTop=v; });
  if(st.__f){ const el=document.getElementById(st.__f.id); if(el&&root.contains(el)){ try{ el.focus({preventScroll:true}); if(st.__f.s!=null&&el.setSelectionRange) el.setSelectionRange(st.__f.s,st.__f.e); }catch(e){} } }
}

/* —— modales —— */
const Modal = {
  list:[],
  open(o){
    const m={id:uid('md'), o, el:document.createElement('div')}; m.el.className='modal-back'; m.el.dataset.mid=m.id;
    m.render=()=>{
      const body=typeof o.body==='function'?o.body(m):o.body; const foot=typeof o.footer==='function'?o.footer(m):(o.footer||'');
      const keep = m.mounted ? snapUI(m.el) : null; const sb=m.mounted?$('.modal-b',m.el):null; const scroll=sb?sb.scrollTop:0;
      m.el.innerHTML='<div class="modal '+(o.size||'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title||'Fenêtre')+'"><div class="modal-h">'+(o.head||'<h2>'+esc(o.title||'')+'</h2>')+'<button class="btn ico ghost" data-act="closeModal" aria-label="Fermer">✕</button></div><div class="modal-b">'+body+'</div>'+(foot?'<div class="modal-f">'+foot+'</div>':'')+'</div>';
      if(keep){ restoreUI(m.el, keep); const nb=$('.modal-b',m.el); if(nb) nb.scrollTop=scroll; }
      m.mounted=true; if(o.onMount) try{ o.onMount(m); }catch(e){ Err.log('modal.onMount',e); }
    };
    m.close=(val)=>{ const i=this.list.indexOf(m); if(i>=0) this.list.splice(i,1); m.el.remove(); if(o.onClose) try{ o.onClose(val); }catch(e){} document.body.style.overflow=this.list.length?'hidden':''; };
    m.el.addEventListener('mousedown', e=>{ if(e.target===m.el && !o.sticky) m.close(); });
    m.render(); $('#modal-root').appendChild(m.el); this.list.push(m); document.body.style.overflow='hidden';
    const first=$('input:not([type=checkbox]):not([type=radio]),textarea',m.el); if(first && !isPhone() && o.autofocus!==false) setTimeout(()=>{ try{ first.focus(); }catch(e){} },60);
    return m;
  },
  top(){ return this.list[this.list.length-1]||null; },
  of(el){ const b=el&&el.closest&&el.closest('.modal-back'); return b?this.list.find(m=>m.id===b.dataset.mid):null; },
  closeAll(){ this.list.slice().forEach(m=>m.close()); },
  refreshLive(){ this.list.forEach(m=>{ if(m.o.live) m.render(); }); }
};

/* —— routeur —— */
const Router = {
  current:'dashboard',
  parse(){ const h=(location.hash||'').replace(/^#\/?/,'').split('?')[0]; return ROUTES.some(r=>r.id===h)?h:'dashboard'; },
  go(id){ if(location.hash==='#/'+id) { this.current=id; renderView(true); } else location.hash='#/'+id; },
  init(){ window.addEventListener('hashchange', ()=>{ this.current=this.parse(); Modal.closeAll(); renderView(true); renderChrome(); window.scrollTo(0,0); }); this.current=this.parse(); }
};
ACT.go = t => Router.go(t.dataset.to);
ACT.moreNav = () => {
  Modal.open({title:'Tous les espaces', size:'sm', autofocus:false, body:'<div class="col" style="gap:6px">'+ROUTES.map(r=>'<a class="btn" style="justify-content:flex-start" href="#/'+r.id+'" data-act="closeModal"><i style="font-style:normal;width:22px;text-align:center">'+r.icon+'</i>'+esc(r.label)+'</a>').join('')+'</div>'});
};
function logoSvg(idp){ return '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="'+idp+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".6" stop-color="#38bdf8"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="rgba(139,92,246,.12)" stroke="url(#'+idp+')" stroke-width="2.5"/><path d="M16 33V15l16 18V15" fill="none" stroke="url(#'+idp+')" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function runningCount(){ return Object.keys(Runner.live).length; }

/* —— rendu de la vue courante —— */
let _rt=null, _renderLock=false;
function renderView(fresh){
  const root=$('#view'); const v=VIEWS[Router.current]; if(!v){ root.innerHTML='<div class="card">Espace introuvable.</div>'; return; }
  if(!fresh && v.skipBg && v.skipBg()) return;   /* vue animée en continu (bureau 3D) : pas de reconstruction */
  const keep = fresh?null:snapUI(root); const y=window.scrollY;
  try{ const pv=VIEWS[Router._last]; if(pv && pv.cleanup && Router._last!==Router.current) pv.cleanup(); }catch(e){}
  try{ root.innerHTML=v.render(); }catch(e){ Err.log('view '+Router.current, e); root.innerHTML='<div class="banner err">Erreur d’affichage de cet espace : '+esc(e.message)+'. Le reste de l’application reste utilisable.</div>'; }
  if(keep) restoreUI(root, keep);
  try{ if(v.after) v.after(root, !!fresh); }catch(e){ Err.log('view.after '+Router.current, e); }
  if(!fresh) window.scrollTo(0,y); Router._last=Router.current;
}
function refreshAll(){ renderView(false); renderChrome(); }
const refreshSoon = debounce(()=>{ if(!document.hidden){ renderView(false); renderChrome(); Modal.refreshLive(); } }, 180);
['missions','comms','agents','docs','files','chat','activity','auto','notes','all','quota'].forEach(ev=>Bus.on(ev, ()=>{ if(ev==='quota') toast('Stockage local plein : exportez vos données ou libérez de la place.','err',7000); refreshSoon(); }));
function setAppearance(){
  const h=document.documentElement; h.dataset.accent=S.settings.accent; h.dataset.anim=String(!!S.settings.anim); h.dataset.compact=String(!!S.settings.compact); h.style.setProperty('--fs', S.settings.fontScale||1);
}

/* —— délégation d'événements —— */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return; const fn=ACT[t.dataset.act];
  if(!fn){ toast('Action non disponible : '+t.dataset.act,'err'); Err.log('act-manquante', t.dataset.act); return; }
  try{ const r=fn(t,e); if(r&&typeof r.catch==='function') r.catch(err=>{ Err.log('act '+t.dataset.act, err); toast('Erreur : '+(err&&err.message||err),'err'); }); }
  catch(err){ Err.log('act '+t.dataset.act, err); toast('Erreur : '+err.message,'err'); }
});
document.addEventListener('input', e=>{ const t=e.target.closest('[data-in]'); if(t&&INP[t.dataset.in]) try{ INP[t.dataset.in](t,e); }catch(err){ Err.log('in',err); } });
document.addEventListener('change', e=>{ const t=e.target.closest('[data-ch]'); if(t&&CHG[t.dataset.ch]) try{ CHG[t.dataset.ch](t,e); }catch(err){ Err.log('ch',err); } });
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ const t=e.target.closest('[data-submit]'); if(t&&ACT[t.dataset.submit]){ e.preventDefault(); ACT[t.dataset.submit](t,e); } } });

  const a=Agents.get(id); if(!a) return '<p>Agent introuvable.</p>'; const key='agent:'+id; const tab=UI.tab[key]||'profil'; const d=DEPT[a.dept]; const stt=Agents.state(id);

    html+='</div></div>';
    if(!isDir){ html+='<div class="card mt"><h3>Méthode de travail</h3>'+(a.m||[]).map(([t,b])=>'<h4 style="margin:10px 0 4px">'+esc(t)+'</h4><ul class="small muted" style="margin:0;padding-left:1.2em">'+b.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>').join('')+'</div>';

ACT.agentTab = t => { UI.tab['agent:'+t.dataset.id]=t.dataset.t; const m=Modal.of(t); if(m) m.render(); };

ACT.memAdd = t => { const m=Modal.of(t); const inp=$('#mem-in',m.el); const v=inp.value.trim(); if(!v) return toast('Saisissez une information.','warn'); const id=t.dataset.id; const s=Agents.state(id); s.mem.unshift({ts:now(),text:v.slice(0,400),missionId:null}); Persist.saveSoon('agentState'); inp.value=''; m.render(); };
ACT.memDel = t => { const s=Agents.state(t.dataset.id); s.mem.splice(+t.dataset.i,1); Persist.saveSoon('agentState'); Modal.of(t).render(); };
ACT.memClear = async t => { if(await confirmBox({title:'Effacer la mémoire', text:'Effacer toute la mémoire de travail de cet agent ?', ok:'Effacer', danger:true})){ Agents.state(t.dataset.id).mem=[]; Persist.saveSoon('agentState'); const m=Modal.top(); m&&m.render(); } };
ACT.chatClear = async t => { if(await confirmBox({title:'Effacer la discussion', text:'Supprimer cette discussion ?', ok:'Effacer', danger:true})) Chat.clear(t.dataset.id); };
ACT.saveChatDoc = t => { const a=Agents.get(t.dataset.id); const msg=Chat.get(t.dataset.id).messages[+t.dataset.i]; if(!msg) return; const d=Docs.create({title:a.name+' — réponse du '+fmtDate(msg.ts), kind:a.del||'document', content:msg.text, agentId:a.id, source:'discussion', engine:msg.engine||''}); toast('Livrable enregistré.','ok'); logAct('livrable','Livrable enregistré depuis une discussion avec '+a.name, d.id); };
ACT.chatSend = async t => {
  const id=t.dataset.id; const m=Modal.of(t); const inp=$('#chatin-'+id, m.el); const text=inp.value.trim(); if(!text) return; inp.value='';
  const a=Agents.get(id); Chat.push(id,{role:'user', text}); Agents.setStatus(id,'reflexion',null); await sleep(Engine.speed===0?0:450);
  try{
    let rep;
    if(Providers.connected() && a.perm && a.perm.useAI!==false){
      const hist=Chat.get(id).messages.slice(-9,-1).map(x=>(x.role==='user'?'Utilisateur : ':a.name+' : ')+x.text.slice(0,800)).join('\n');
      const ctxFiles=(a.perm&&a.perm.readKnowledge!==false)?Know.readable().slice(0,3).map(f=>'### '+f.name+'\n'+f.text.slice(0,3000)).join('\n\n'):'';
      const r=await Providers.call({system:a.instr+'\nRéponds en français, de façon concise. N’invente aucun fait sur l’utilisateur ou son entreprise. Tu ne peux exécuter aucune action externe.', user:(hist?'Historique :\n'+hist+'\n\n':'')+(ctxFiles?'Connaissances :\n'+ctxFiles+'\n\n':'')+'Message : '+text, maxTokens:1500});
      Usage.add({tin:r.tin,tout:r.tout,source:'model'}); rep={text:r.text, engine:r.model, canSave:r.text.length>400};
    } else { rep=Engine.chatReply(a, text); rep.engine='moteur local'; Usage.add({tin:estTokens(text),tout:estTokens(rep.text),source:'local'}); }

function commCard(c){

ACT.mDelete = async t => { const m=Missions.get(t.dataset.id); if(!(await confirmBox({title:'Supprimer la mission', text:'Supprimer <b>'+esc(m.title)+'</b> ? Les livrables déjà produits restent dans « Documents ».', ok:'Supprimer', danger:true}))) return; Modal.of(t)&&Modal.of(t).close(); await Missions.remove(t.dataset.id); toast('Mission supprimée.','ok'); };

const Wiz = {step:0, d:null};
function proposeTeam(d){
  const base=(TEAM_BASE[d.type]||TEAM_BASE.Autre).slice(); const txt=norm([d.sector,d.goals,d.difficulties,d.tasksAuto].join(' '));
  const extra=BASE_AGENTS.map(a=>({id:a.id, s:(a.kw||[]).reduce((n,k)=>n+(hasKw(txt,k)?1:0),0)+(a.skills||[]).reduce((n,k)=>n+(hasKw(txt,k)?1:0),0)})).filter(x=>x.s>0&&!base.includes(x.id)).sort((a,b)=>b.s-a.s).map(x=>x.id);
  return Array.from(new Set([...base,...extra,...BASE_AGENTS.map(a=>a.id)])).slice(0,clamp(d.teamSize||12,3,34));
}

  Wiz.step=0; Wiz.d=Object.assign({}, S.profile, {teamSize:S.profile.teamSize||12});
  Wiz.m=Modal.open({title:'Assistant de configuration', size:'lg', sticky:true, live:false, body:()=>wizBody(), footer:()=>wizFooter(), onClose:()=>{ if(!S.profile.done){ S.profile.skipped=true; Persist.saveSoon('profile'); } }, autofocus:false});
}
function wizBody(){

  if(st===3) return dots+'<h3>Taille de l’équipe et autonomie</h3><label class="f" for="wz-size">Nombre d’agents souhaité : <b id="wz-size-v">'+d.teamSize+'</b></label><input type="range" id="wz-size" min="3" max="34" value="'+d.teamSize+'" data-in="wzSize"><p class="muted tiny">Les agents non retenus sont seulement désactivés : vous pourrez les réactiver à tout moment.</p><label class="f">Niveau d’autonomie du directeur</label><div class="col">'+[['manuel','Manuel','Le directeur propose un plan ; rien ne démarre sans votre clic.'],['supervise','Supervisé','Les missions s’exécutent, puis attendent votre validation.'],['autonome','Autonome','Les missions s’exécutent et se terminent sans validation.']].map(([v,l,x])=>'<label class="chk card" style="padding:10px 12px"><input type="radio" name="wz-aut" value="'+v+'" '+((d.autonomy||'autonome')===v?'checked':'')+' data-ch="wzAut"><span><b>'+l+'</b><br><span class="muted small">'+x+'</span></span></label>').join('')+'</div>';
  const team=Wiz.team||proposeTeam(d);
  return dots+'<h3>Équipe proposée ('+team.length+')</h3><p class="muted small">Décochez ou cochez librement les agents. Le directeur NEXUS est toujours présent.</p><div style="max-height:46dvh;overflow:auto">'+DEPTS.map(dp=>{ const ag=BASE_AGENTS.filter(a=>a.dept===dp.id); return '<div class="mb"><div class="tiny" style="color:'+dp.color+'">'+dp.icon+' '+esc(dp.name)+'</div><div class="row" style="gap:6px">'+ag.map(a=>'<label class="chip btnlike '+(team.includes(a.id)?'on':'')+'" style="cursor:pointer"><input type="checkbox" name="wz-team" value="'+a.id+'" '+(team.includes(a.id)?'checked':'')+' style="width:14px;height:14px" data-ch="chipToggle"> '+esc(a.name)+' <span class="dim">· '+esc(a.role.split(/[,&(]/)[0])+'</span></label>').join('')+'</div></div>'; }).join('')+'</div>';

CHG.wzAut = el => { Wiz.d.autonomy=el.value; };
INP.wzSize = el => { Wiz.d.teamSize=+el.value; $('#wz-size-v',Wiz.m.el).textContent=el.value; };

};

/* ═══════════════════════════════════════════════════════════════════════════
   9e. VUES (1/2) : tableau de bord · commandement · équipe · départements · missions · communications
   ═══════════════════════════════════════════════════════════════════════════ */
function barChart(days, series, opts={}){
  /* days : étiquettes ; series : [{name,color,data[]}] empilées */
  const W=620,H=190,pl=32,pb=24,pt=10,pr=8; const n=days.length; const tot=days.map((_,i)=>series.reduce((a,s)=>a+(s.data[i]||0),0)); const max=Math.max(1,...tot);
  const bw=(W-pl-pr)/n; let out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'Graphique')+'">';
  for(let g=0;g<=3;g++){ const y=pt+(H-pt-pb)*(1-g/3); out+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*g/3)+'</text>'; }
  days.forEach((d,i)=>{ let y=H-pb; series.forEach(s=>{ const v=s.data[i]||0; const h=(H-pt-pb)*v/max; y-=h; if(v>0) out+='<rect x="'+(pl+i*bw+bw*.18)+'" y="'+y+'" width="'+(bw*.64)+'" height="'+h+'" rx="3" fill="'+s.color+'"><title>'+esc(d+' — '+s.name+' : '+v)+'</title></rect>'; });
    if(n<=16||i%Math.ceil(n/12)===0) out+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(d)+'</text>'; });
  return out+'</svg>';
}
function lineChart(lines, opts={}){
  const W=620,H=opts.h||220,pl=44,pb=22,pt=10,pr=10; const all=lines.flatMap(l=>l.data.filter(v=>v!=null&&isFinite(v))); if(!all.length) return '';
  let mn=Math.min(...all), mx=Math.max(...all); if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*.06; mn-=pad; mx+=pad; const n=Math.max(...lines.map(l=>l.data.length));
  const X=i=>pl+(W-pl-pr)*i/Math.max(1,n-1), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'Courbe')+'">';

  lines.forEach(l=>{ let d='', pen=false; l.data.forEach((v,i)=>{ if(v==null||!isFinite(v)){ pen=false; return; } d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; pen=true; }); out+='<path d="'+d+'" fill="none" stroke="'+l.color+'" stroke-width="'+(l.w||1.8)+'" stroke-linejoin="round" '+(l.dash?'stroke-dasharray="4 3"':'')+'/>'; });

  const lab=opts.labels; if(lab&&lab.length){ [0,Math.floor(n/2),n-1].forEach((i,k)=>{ out+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(k===0?'start':k===2?'end':'middle')+'">'+esc(String(lab[i]||''))+'</text>'; }); }

}
function lastDays(n){ const out=[]; const d=new Date(); d.setHours(0,0,0,0); for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push({key:dayKey(x.getTime()), label:pad2(x.getDate())+'/'+pad2(x.getMonth()+1)}); } return out; }

  Modal.open({title:a.id?'Modifier l’automatisation':'Nouvelle automatisation', size:'lg', body:
    '<label class="f" for="au-name">Nom *</label><input type="text" id="au-name" value="'+esc(a.name)+'"><label class="f" for="au-req">Demande confiée au directeur à chaque exécution *</label><textarea id="au-req">'+esc(a.request)+'</textarea>'+
    '<div class="grid c3"><div><label class="f" for="au-type">Fréquence</label><select id="au-type" data-ch="auType">'+[['manuel','Manuelle uniquement'],['quotidien','Tous les jours'],['hebdo','Chaque semaine'],['mensuel','Chaque mois']].map(([v,l])=>'<option value="'+v+'" '+(sch.type===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
    '<div id="au-time-w" class="'+(sch.type==='manuel'?'hide':'')+'"><label class="f" for="au-time">Heure</label><input type="time" id="au-time" value="'+esc(sch.time||'09:00')+'"></div>'+
    '<div id="au-dow-w" class="'+(sch.type==='hebdo'?'':'hide')+'"><label class="f" for="au-dow">Jour</label><select id="au-dow">'+DOW.map((d,i)=>'<option value="'+i+'" '+(sch.dow===i?'selected':'')+'>'+d+'</option>').join('')+'</select></div>'+
    '<div id="au-dom-w" class="'+(sch.type==='mensuel'?'':'hide')+'"><label class="f" for="au-dom">Jour du mois (1–28)</label><input type="number" id="au-dom" min="1" max="28" value="'+(sch.dom||1)+'"></div></div>'+
    '<label class="chk"><input type="checkbox" id="au-en" '+(a.enabled?'checked':'')+'> Activée (s’exécute tant que l’application est ouverte)</label>',
    footer:'<button class="btn" data-act="closeModal">Annuler</button><button class="btn pri" data-act="autoSave" data-id="'+(a.id||'')+'">Enregistrer</button>'});
}

  const old=t.dataset.id?Auto.get(t.dataset.id):null; const a=Object.assign(old||{id:uid('au'), createdAt:now(), runs:[], lastRun:0}, {name, request:req, sch, enabled:g('en').checked&&type!=='manuel'});
  Auto.save(a); m.close(); toast('Automatisation enregistrée.'+(type==='manuel'?' (manuelle : à lancer vous-même)':''),'ok');

  const ACTS=new Set(Object.keys(ACT)), INPS=new Set(Object.keys(INP)), CHGS=new Set(Object.keys(CHG)); const dead=[]; let routesOk=0;
  const keepTab=UI.tab.settings;

  UI.tab.settings=keepTab; UI.tab.memory='files'; UI.tab.trading='dash';
  add('Les '+ROUTES.length+' espaces s’affichent sans erreur', routesOk===ROUTES.length, routesOk+' / '+ROUTES.length);
  add('Aucun bouton ni champ sans action associée', dead.length===0, dead.length?dead.slice(0,8).join(', '):'');
  let eng=true, why=''; Agents.all().forEach(a=>{ try{ const t=Engine.produce(a,'Test',{request:'Test',files:[],notes:[],profile:{}},[]); if(!t||t.length<300||/undefined|NaN|\[object/.test(t)){ eng=false; why=a.name; } }catch(e){ eng=false; why=a.name+' : '+e.message; } });
  add('Le moteur local produit un livrable valide pour chaque agent', eng, why);
  const probes=['Prépare une campagne publicitaire','Analyse mon entreprise et propose cinq améliorations','Organise le travail de mon équipe cette semaine','Prépare une stratégie commerciale','Demande à ton équipe de réaliser un audit complet de mon projet']; const bad=probes.filter(q=>!Director.plan(q,{}).steps.length); add('Le directeur construit un plan pour les demandes types', bad.length===0, bad.join(' | '));

  try{ const b=await Backup.build(false); add('Export/validation d’une sauvegarde', Backup.validate(JSON.parse(JSON.stringify(b)))===''); }catch(e){ add('Export de sauvegarde',false,e.message); }
  add('Données du trading : moteur de simulation cohérent', (()=>{ const s=Trading.synthetic(7,200); const p=Object.assign({},DEFAULT_TRADING,{feePct:0.1}); const r=Trading.backtest(s,p); return Math.abs(p.capital+r.trades.reduce((a,t)=>a+t.pnl,0)-r.stats.final)<0.01; })());
  add('Fournisseur IA', true, Providers.connected()?'connecté : '+Providers.label():'aucun connecté : moteur local de démonstration (état normal)');

      if(last&&last.trades.length) h+='<div class="card"><div class="row"><h3 class="grow">Opérations de la dernière simulation ('+last.trades.length+')</h3><button class="btn sm" data-act="trExport">⤓ CSV</button></div><div class="tablewrap"><table class="rtable"><thead><tr><th>Entrée</th><th>Sortie</th><th>Prix entrée</th><th>Prix sortie</th><th>Quantité</th><th>Résultat</th><th>Motif</th></tr></thead><tbody>'+last.trades.slice(0,200).map(t=>'<tr><td data-l="Entrée">'+esc(t.entryDate)+'</td><td data-l="Sortie">'+esc(t.exitDate)+'</td><td data-l="Prix entrée">'+fmtNum(t.entry)+'</td><td data-l="Prix sortie">'+fmtNum(t.exit)+'</td><td data-l="Quantité">'+fmtNum(t.qty)+'</td><td data-l="Résultat" style="color:'+(t.pnl>=0?'#a7f3d0':'#fecaca')+'">'+(t.pnl>=0?'+':'')+fmtNum(t.pnl)+'</td><td data-l="Motif">'+esc(t.why)+'</td></tr>').join('')+'</tbody></table></div></div>';

    }

};
function riskOut(cap,r,e,s){ const z=Trading.sizing(+cap,+r,+e,+s); if(!z) return '<span class="muted small">Entrez un prix d’entrée et un stop différents.</span>'; return '<dl class="kv"><dt>Montant risqué</dt><dd><b>'+fmtNum(z.risk)+'</b></dd><dt>Quantité</dt><dd><b>'+fmtNum(z.qty)+'</b></dd><dt>Valeur de la position</dt><dd>'+fmtNum(z.notional)+' ('+z.pctCapital.toFixed(1)+' % du capital)</dd></dl>'+(z.pctCapital>100?'<div class="banner warn small mt">La position dépasse le capital : réduisez le risque ou éloignez le stop.</div>':''); }
INP.riskCalc = el => { const m=el.closest('.card'); const g=id=>$('#'+id,m).value; $('#rk-out',m).innerHTML=riskOut(g('rk-cap'),g('rk-r'),g('rk-e'),g('rk-s')); };
INP.trParam = el => { const v=parseFloat(el.value); if(!isFinite(v)) return; S.trading[el.dataset.p]=v; Persist.saveSoon('trading'); };
CHG.trStrat = el => { S.trading.strategy=el.value; Persist.saveSoon('trading'); toast('Stratégie : '+STRAT[el.value],'ok'); };
ACT.trSynth = () => { const seed=parseInt($('#tr-seed').value)||42; S.trading.series=Trading.synthetic(seed,400); S.trading.seed=seed; Persist.saveSoon('trading'); toast('Série synthétique générée (graine '+seed+').','ok'); refreshAll(); };
CHG.trFile = async el => { const f=el.files[0]; if(!f) return; try{ S.trading.series=Trading.importCsv(await readText(f), f.name); Persist.saveSoon('trading'); toast('Données importées : '+S.trading.series.close.length+' points (colonne « '+S.trading.series.column+' »).','ok'); refreshAll(); }catch(e){ toast(e.message,'err',6000); } el.value=''; };
ACT.trRun = () => {
  const T=S.trading; if(!T.series){ T.series=Trading.synthetic(T.seed||42,400); toast('Aucune série : une série synthétique a été générée.','info'); }
  const p={strategy:T.strategy,fast:T.fast,slow:T.slow,stopPct:T.stopPct,takeProfitPct:T.takeProfitPct,riskPct:T.riskPct,capital:T.capital,feePct:T.feePct||0};
  if(p.strategy==='sma'&&p.fast>=p.slow) return toast('La fenêtre « fast » doit être plus petite que « slow ».','warn');
  if(T.series.close.length<=p.slow+2) return toast('Série trop courte pour la fenêtre « slow ».','warn'); if(p.stopPct<=0||p.riskPct<=0||p.capital<=0) return toast('Stop, risque et capital doivent être positifs.','warn');
  const r=Trading.backtest(T.series,p);
  T.last={at:now(), params:p, series:T.series.name+(T.series.kind==='synthetique'?' [synthétique]':''), seriesName:T.series.name, stats:r.stats, equity:r.equity.map(v=>Math.round(v*100)/100), dates:T.series.dates, trades:r.trades.slice(0,500)};
  T.backtests.unshift({at:now(), strategy:STRAT[p.strategy].split('(')[0].trim(), series:T.last.series, n:r.stats.n, pnl:r.stats.pnl, ret:r.stats.ret, maxDD:r.stats.maxDD}); if(T.backtests.length>30) T.backtests.length=30;
  Persist.saveSoon('trading'); logAct('trading','Simulation de trading : '+r.stats.n+' opération(s), '+(r.stats.ret*100).toFixed(1)+' %'); UI.tab.trading='dash'; toast('Simulation terminée (aucune transaction réelle).','ok'); refreshAll();
};
ACT.trClear = async () => { if(await confirmBox({title:'Effacer l’historique', text:'Effacer l’historique et la dernière simulation ?', ok:'Effacer', danger:true})){ S.trading.backtests=[]; S.trading.last=null; Persist.saveSoon('trading'); refreshAll(); } };
function tradesCsv(){ const t=S.trading.last; return toCSV([['Date entrée','Date sortie','Prix entrée','Prix sortie','Quantité','Résultat','Motif']].concat(t.trades.map(x=>[x.entryDate,x.exitDate,x.entry.toFixed(2),x.exit.toFixed(2),x.qty.toFixed(4),x.pnl.toFixed(2),x.why])),';'); }
ACT.trExport = () => { download('simulation-trading-operations.csv', tradesCsv(), 'text/csv'); toast('CSV téléchargé.','ok'); };
ACT.trReview = async () => {
  const last=S.trading.last; if(!last||!last.trades.length) return;
  try{ const f=new File([tradesCsv()], 'simulation-trading-'+dayKey(now())+'.csv', {type:'text/csv'}); const meta=await Know.add(f,{folder:'Trading (simulation)'});
    const r=Director.createMission('Revue de la simulation de trading : examiner le risque, calculer les statistiques des opérations et structurer le suivi. Simulation uniquement, aucune transaction réelle.', {fileIds:[meta.id], title:'Revue de la simulation de trading'}); if(r.error) return toast(r.error,'err');
    toast('Mission de revue créée.','ok'); if(S.settings.autonomy!=='manuel') Runner.start(r.mission.id); openMission(r.mission.id);
  }catch(e){ toast(e.message,'err'); }
};


/* ═══════════════════════════════════════════════════════════════════════════
   9g. BUREAU VIRTUEL 3D — moteur de projection 3D intégré (canvas 2D), sans bibliothèque externe,
   donc utilisable hors ligne. Mode simplifié (HTML) automatique si l'appareil est limité.
   ═══════════════════════════════════════════════════════════════════════════ */
const OFFICE_EXTRA = [
  {id:'meeting', name:'Salle de réunion', color:'#f59e0b', icon:'◍'},
  {id:'collab',  name:'Espace collaboratif', color:'#fb923c', icon:'❖'}
];
const Office = {
  cv:null, cx:null, raf:0, ac:null, ro:null, W:0, H:0, dpr:1, yaw:.62, zoom:1, zoomT:1, px:0, pz:0, pxT:0, pzT:0, pitch:.88,
  pos:{}, hits:[], hover:null, pts:new Map(), drag:null, frames:0, slowN:0, lastT:0, running:false,
  CELL:7.2, CMD:7,
  simple(){
    if(UI.state.officeForceSimple) return true; const m=S.settings.officeMode; if(m==='simple') return true; if(m==='3d') return false;
    try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return true; if((navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2)) return true; const t=document.createElement('canvas'); if(!t.getContext||!t.getContext('2d')) return true; }catch(e){ return true; }
    return false;
  },
  zones(){
    const z=[]; const list=DEPTS.concat(OFFICE_EXTRA); let k=0;
    for(let r=0;r<4;r++) for(let c=0;c<5;c++){ const i=r*5+c; const cx=(c-2)*this.CELL, cz=(r-1.5)*this.CELL;
      if(i===this.CMD) z.push({id:'command', name:'Centre de commandement', color:'#fb923c', icon:'✦', cx, cz, cmd:true});
      else { const d=list[k++]; if(d) z.push({id:d.id, name:d.name, color:d.color, icon:d.icon, cx, cz, dept:DEPT[d.id]?d.id:null, extra:!DEPT[d.id]}); } }
    return z;
  },
  /* positions : domicile (bureau) ou point de collaboration / pause selon le statut */
  layout(){
    const Z=this.zones(); const zone=Object.fromEntries(Z.map(z=>[z.id,z])); const homes={}; const targets={};
    DEPTS.forEach(d=>{ const z=zone[d.id]; Agents.byDept(d.id).filter(a=>Agents.isActive(a.id)).slice(0,9).forEach((a,k)=>{ homes[a.id]={x:z.cx+((k%3)-1)*2.3, z:z.cz+Math.floor(k/3)*2.3-.9, dx:z.cx+((k%3)-1)*2.3, dz:z.cz+Math.floor(k/3)*2.3-.2}; }); });
    const meet=zone.meeting, lounge=zone.collab; let mi=0, li=0;
    const inMeet=[], inLounge=[];
    Object.keys(homes).forEach(id=>{ const st=Agents.st(id); if(st==='collab') inMeet.push(id); else if(st==='attente'||st==='termine') inLounge.push(id); });
    Object.keys(homes).forEach(id=>{ let t={x:homes[id].x, z:homes[id].z};
      if(inMeet.includes(id)){ const n=Math.max(inMeet.length,6); const a=inMeet.indexOf(id)*2*Math.PI/n; t={x:meet.cx+Math.cos(a)*2.1, z:meet.cz+Math.sin(a)*1.5}; }
      else if(inLounge.includes(id)){ const n=Math.max(inLounge.length,5); const a=inLounge.indexOf(id)*2*Math.PI/n+.4; t={x:lounge.cx+Math.cos(a)*2, z:lounge.cz+Math.sin(a)*1.6}; }
      targets[id]=t; });
    const cz=zone.command; targets.DIR={x:cz.cx, z:cz.cz-.2};
    return {Z, zone, homes, targets};
  },
  mount(cv){
    this.stop(); this.cv=cv; this.cx=cv.getContext('2d'); this.ac=new AbortController(); const sg={signal:this.ac.signal};
    this.fit(); window.addEventListener('resize', ()=>this.fit(), sg);
    if(window.ResizeObserver){ this.ro=new ResizeObserver(()=>this.fit()); this.ro.observe(cv.parentElement); }
    cv.addEventListener('pointerdown', e=>this.down(e), sg); cv.addEventListener('pointermove', e=>this.move(e), sg); cv.addEventListener('pointerup', e=>this.up(e), sg); cv.addEventListener('pointercancel', e=>this.up(e,true), sg); cv.addEventListener('pointerleave', ()=>{ this.hover=null; this.tip(); }, sg);
    cv.addEventListener('wheel', e=>{ e.preventDefault(); this.zoomT=clamp(this.zoomT*Math.exp(-e.deltaY*.0015),.6,4.5); }, {passive:false, signal:this.ac.signal});
    cv.addEventListener('contextmenu', e=>e.preventDefault(), sg);
    if(isPhone()){ this.zoom=this.zoomT=1.5; } this.running=true; this.frames=0; this.slowN=0; this.lastT=performance.now(); this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  stop(){ this.running=false; cancelAnimationFrame(this.raf); if(this.ac) this.ac.abort(); if(this.ro) try{ this.ro.disconnect(); }catch(e){} this.ac=null; this.ro=null; this.cv=null; this.pts.clear(); },
  fit(){ if(!this.cv) return; const p=this.cv.parentElement; this.dpr=Math.min(window.devicePixelRatio||1,2); this.W=Math.max(200,p.clientWidth); this.H=Math.max(200,p.clientHeight); this.cv.width=Math.round(this.W*this.dpr); this.cv.height=Math.round(this.H*this.dpr); },
  reset(){ this.yaw=.62; this.zoomT=isPhone()?1.5:1; this.pxT=0; this.pzT=0; },
  /* projection orthographique avec rotation (yaw) et inclinaison fixe */
  P(x,y,z){ const cy=Math.cos(this.yaw), sy=Math.sin(this.yaw); const X=x-this.px, Z=z-this.pz; const xr=X*cy-Z*sy, zr=X*sy+Z*cy; const sc=this.sc; return {x:this.W/2+xr*sc, y:this.H*.54+(zr*Math.sin(this.pitch)-y*Math.cos(this.pitch))*sc, d:zr}; },
  unP(sx,sy){ const sc=this.sc; const xr=(sx-this.W/2)/sc; const zr=((sy-this.H*.54)/sc)/Math.sin(this.pitch); const cy=Math.cos(this.yaw), sn=Math.sin(this.yaw); return {x:xr*cy+zr*sn+this.px, z:-xr*sn+zr*cy+this.pz}; },
  /* —— interaction —— */
  down(e){ this.cv.setPointerCapture(e.pointerId); this.pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); this.drag={sx:e.offsetX, sy:e.offsetY, moved:false, pan:e.shiftKey||e.button===2||e.button===1, t:performance.now()}; if(this.pts.size===2){ const [a,b]=[...this.pts.values()]; this.pinch={d:Math.hypot(a.x-b.x,a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; this.drag.moved=true; } },
  move(e){

    if(this.pts.size===2 && this.pinch){ const [a,b]=[...this.pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2; this.zoomT=this.zoom=clamp(this.zoom*d/this.pinch.d,.6,4.5); this.panBy(mx-this.pinch.mx, my-this.pinch.my); this.pinch={d,mx,my}; return; }

  },
  up(e,cancel){
