    if(!cancel && was && !was.moved && performance.now()-was.t<600){ this.click(e.offsetX,e.offsetY); } this.drag=null;
  },
  panBy(dx,dy){ const sc=this.sc; const xr=-dx/sc, zr=-dy/(Math.sin(this.pitch)*sc); const cy=Math.cos(this.yaw), sn=Math.sin(this.yaw); this.px=this.pxT=clamp(this.px+xr*cy+zr*sn,-22,22); this.pz=this.pzT=clamp(this.pz+(-xr*sn+zr*cy),-18,18); },
  hit(x,y){ let best=null; for(let i=this.hits.length-1;i>=0;i--){ const h=this.hits[i]; if(Math.hypot(h.x-x,h.y-y)<=h.r+5){ best=h; break; } } return best; },
  click(x,y){ const h=this.hit(x,y); if(h){ UI.state.officeSel=h.id; openAgent(h.id); return; } const g=this.unP(x,y); const z=this.zones().find(z=>Math.abs(g.x-z.cx)<3.5&&Math.abs(g.z-z.cz)<3.5); if(z){ this.pxT=z.cx; this.pzT=z.cz; this.zoomT=Math.max(this.zoomT,2.3); } },
  tip(x,y){ const t=$('#office-tip'); if(!t) return; if(!this.hover){ t.style.display='none'; return; } const a=Agents.get(this.hover.id); if(!a){ t.style.display='none'; return; } t.style.display='block'; t.style.left=clamp(x+14,4,this.W-190)+'px'; t.style.top=clamp(y+14,4,this.H-60)+'px'; t.innerHTML='<b>'+esc(a.name)+'</b><br><span class="muted">'+esc(a.role)+'</span><br>'+statusChip(this.hover.id==='DIR'?Agents.st('DIR'):Agents.st(a.id)); },
  /* —— boucle de rendu —— */
  loop(t){
    if(!this.running||!this.cv||!this.cv.isConnected){ this.running=false; return; }
    this.raf=requestAnimationFrame(tt=>this.loop(tt)); if(document.hidden) return;
    const dt=t-this.lastT; const phone=isPhone(); if(dt<(phone?30:14)) return; this.lastT=t;
    if(this.frames>20){ if(dt>70) this.slowN++; else this.slowN=Math.max(0,this.slowN-1); if(this.slowN>45 && S.settings.officeMode==='auto'){ UI.state.officeForceSimple=true; toast('Appareil limité : bascule automatique vers le bureau simplifié.','warn',5000); this.stop(); renderView(true); return; } }
    this.frames++; this.zoom+=(this.zoomT-this.zoom)*.18; this.px+=(this.pxT-this.px)*.18; this.pz+=(this.pzT-this.pz)*.18; this.draw(t/1000, Math.min(dt,80)/1000);
  },
  draw(T, dt){
    const c=this.cx, W=this.W, H=this.H; c.setTransform(this.dpr,0,0,this.dpr,0,0); this.sc=Math.min(W/50,H/36)*this.zoom; const sc=this.sc;
    const bg=c.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0b0820'); bg.addColorStop(1,'#04030a'); c.fillStyle=bg; c.fillRect(0,0,W,H);
    const L=this.layout(); this.hits=[]; const items=[]; const sin=Math.sin(this.yaw), cos=Math.cos(this.yaw);
    /* sol */
    const gp=[[-19,-17],[19,-17],[19,17],[-19,17]].map(([x,z])=>this.P(x,0,z)); c.beginPath(); gp.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath(); c.fillStyle='rgba(20,16,44,.85)'; c.fill(); c.strokeStyle='rgba(139,92,246,.35)'; c.lineWidth=1.5; c.stroke();
    c.lineWidth=1; c.strokeStyle='rgba(139,92,246,.07)'; for(let i=-18;i<=18;i+=3.6){ let a=this.P(i,0,-17), b=this.P(i,0,17); c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); a=this.P(-19,0,i*.9); b=this.P(19,0,i*.9); c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    /* zones */
    L.Z.forEach(z=>{ const h=3.3; const q=[[-h,-h],[h,-h],[h,h],[-h,h]].map(([x,zz])=>this.P(z.cx+x,0.01,z.cz+zz)); c.beginPath(); q.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath();
      c.fillStyle=z.color+(z.cmd?'2e':'16'); c.fill(); c.strokeStyle=z.color+(z.cmd?'cc':'66'); c.lineWidth=z.cmd?2:1.2; c.stroke();
      const low=q.slice().sort((m,n)=>n.y-m.y).slice(0,2); const lx=(low[0].x+low[1].x)/2, ly=(low[0].y+low[1].y)/2; const dd=Math.max(...q.map(p=>p.d));
      items.push({d:dd+.2, f:()=>{ if(sc<6.5) return; const fs=Math.round(clamp(sc*.8,9,14)); c.font='700 '+fs+'px system-ui,sans-serif'; c.textAlign='center'; const txt=z.icon+' '+z.name; const tw=c.measureText(txt).width; c.fillStyle='rgba(6,5,11,.6)'; c.fillRect(lx-tw/2-4, ly-fs-3, tw+8, fs+5); c.fillStyle=z.color; c.fillText(txt, lx, ly-5); }}); });
    /* meubles : bureaux, table de réunion, canapés, table de commandement */
    const box=(cx,cz,w,d,h,top,side,glow)=>{ const hw=w/2, hd=d/2; const pts=[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]]; const b=pts.map(([x,z])=>this.P(cx+x,0,cz+z)), t=pts.map(([x,z])=>this.P(cx+x,h,cz+z));
      const faces=[[0,1,[0,-1]],[1,2,[1,0]],[2,3,[0,1]],[3,0,[-1,0]]];
      c.lineWidth=.8; faces.forEach(([i,j,n])=>{ const nz=n[0]*sin+n[1]*cos; if(nz<=0) return; c.beginPath(); c.moveTo(b[i].x,b[i].y); c.lineTo(b[j].x,b[j].y); c.lineTo(t[j].x,t[j].y); c.lineTo(t[i].x,t[i].y); c.closePath(); c.fillStyle=side; c.fill(); c.strokeStyle='rgba(0,0,0,.35)'; c.stroke(); });
      c.beginPath(); t.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath(); c.fillStyle=top; c.fill(); if(glow){ c.strokeStyle=glow; c.lineWidth=1.5; c.stroke(); } };
    Object.keys(L.homes).forEach(id=>{ const hm=L.homes[id]; const a=Agents.get(id); const st=Agents.st(id); const active=['mission','reflexion','collab'].includes(st); const d=this.P(hm.dx,0,hm.dz).d;
      items.push({d, f:()=>{ box(hm.dx,hm.dz,1.6,.85,.55,'#2d2858','#1d1940', active?AGENT_STATUS[st].color+'aa':null); const mon=this.P(hm.dx,.55,hm.dz+.25), mt=this.P(hm.dx,1.05,hm.dz+.25); c.strokeStyle=active?AGENT_STATUS[st].color:'#4b4675'; c.lineWidth=Math.max(2,sc*.5); c.lineCap='round'; c.beginPath(); c.moveTo(mon.x,mon.y); c.lineTo(mt.x,mt.y); c.stroke(); c.lineCap='butt'; }}); });
    const zm=L.zone.meeting; items.push({d:this.P(zm.cx,0,zm.cz).d, f:()=>box(zm.cx,zm.cz,2.6,1.1,.5,'#3a2f1a','#241c0e', null)});
    const zl=L.zone.collab; [[-1.6,.6],[1.6,.6]].forEach(([x,z])=>items.push({d:this.P(zl.cx+x,0,zl.cz+z).d, f:()=>box(zl.cx+x,zl.cz+z,1.8,.7,.4,'#5a3a1b','#33200e', null)}));
    const zc=L.zone.command; items.push({d:this.P(zc.cx,0,zc.cz).d-.2, f:()=>{ const pulse=.5+.5*Math.sin(T*2); const ring=(r,y,al)=>{ c.beginPath(); for(let k=0;k<=36;k++){ const a=k/36*2*Math.PI; const p=this.P(zc.cx+Math.cos(a)*r, y, zc.cz+Math.sin(a)*r); k?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); } c.strokeStyle='rgba(251,146,60,'+al+')'; c.lineWidth=2; c.stroke(); }; ring(2.3,.05,.9); ring(1.5,.05,.5); ring(2.0+pulse*.3,1.9,.25+pulse*.3); ring(1.2,1.9+pulse*.2,.18); }});
    /* avatars */
    const all=Object.keys(L.targets); all.forEach(id=>{ const tg=L.targets[id]; const p=this.pos[id]||(this.pos[id]={x:tg.x, z:tg.z}); const k=1-Math.pow(.0006,dt); p.x+=(tg.x-p.x)*k; p.z+=(tg.z-p.z)*k; p.moving=Math.hypot(tg.x-p.x,tg.z-p.z)>.08; });
    all.forEach(id=>{ const p=this.pos[id]; const a=Agents.get(id); if(!a) return; const st=id==='DIR'?Agents.st('DIR'):Agents.st(id); const sCol=(AGENT_STATUS[st]||AGENT_STATUS.dispo).color; const active=['mission','reflexion','collab'].includes(st);
      const bob = active||p.moving ? Math.sin(T*6+id.length*2)*.07 : Math.sin(T*1.5+id.length)*.02; const big=id==='DIR'?1.25:1;
      const f=this.P(p.x,0,p.z), hd=this.P(p.x,(1.55+bob)*big,p.z); const r=Math.max(5,sc*.5*big); const sel=UI.state.officeSel===id;
      items.push({d:f.d+.05, f:()=>{ c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(f.x,f.y,r*1.05,r*.45,0,0,7); c.fill();
        const [c1,c2]=agentColors(a); const g=c.createLinearGradient(f.x,hd.y,f.x,f.y); g.addColorStop(0,c1); g.addColorStop(1,c2); c.strokeStyle=g; c.lineWidth=r*1.55; c.lineCap='round'; c.beginPath(); c.moveTo(f.x,f.y-r*.3); c.lineTo(hd.x,hd.y+r*.9); c.stroke(); c.lineCap='butt';
        c.beginPath(); c.arc(hd.x,hd.y,r,0,7); c.fillStyle=c1; c.fill(); const hg=c.createRadialGradient(hd.x-r*.3,hd.y-r*.35,r*.1,hd.x,hd.y,r); hg.addColorStop(0,'rgba(255,255,255,.55)'); hg.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=hg; c.fill();
        c.lineWidth=Math.max(1.5,r*.22); c.strokeStyle=sCol; c.globalAlpha=active?(.65+.35*Math.sin(T*5)):1; c.beginPath(); c.arc(hd.x,hd.y,r+Math.max(2,r*.28),0,7); c.stroke(); c.globalAlpha=1;
        if(sel||(this.hover&&this.hover.id===id)){ c.strokeStyle='#fff'; c.lineWidth=1.5; c.beginPath(); c.arc(hd.x,hd.y,r+Math.max(5,r*.6),0,7); c.stroke(); }
        if(r>=7){ c.fillStyle='#fff'; c.font='800 '+Math.round(r*.78)+'px system-ui,sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(id==='DIR'?'◈':a.name.slice(0,2),hd.x,hd.y+1); c.textBaseline='alphabetic'; }
        if(sc>12.5||sel||(this.hover&&this.hover.id===id)){ c.font='600 '+Math.round(clamp(sc*.62,9,12))+'px system-ui,sans-serif'; c.textAlign='center'; const tw=c.measureText(a.name).width; c.fillStyle='rgba(6,5,11,.72)'; c.fillRect(f.x-tw/2-3,f.y+3,tw+6,14); c.fillStyle='#f4f3fb'; c.fillText(a.name,f.x,f.y+14); }
        this.hits.push({id,x:hd.x,y:hd.y,r}); }}); });
    items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
    /* échanges en cours : arcs lumineux entre agents */
    const nowMs=Date.now(); S.comms.slice(0,12).forEach(m=>{ if(nowMs-m.ts>7000||m.to==='USER') return; const a=this.pos[m.from], b=this.pos[m.to]; if(!a||!b) return; const age=(nowMs-m.ts)/7000; c.strokeStyle='rgba(251,146,60,'+(.85-age*.6)+')'; c.lineWidth=2; c.beginPath(); for(let k=0;k<=16;k++){ const u=k/16; const p=this.P(a.x+(b.x-a.x)*u, 1.8+Math.sin(Math.PI*u)*1.8, a.z+(b.z-a.z)*u); k?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); } c.stroke();
      const u=(T*.9)%1; const p=this.P(a.x+(b.x-a.x)*u, 1.8+Math.sin(Math.PI*u)*1.8, a.z+(b.z-a.z)*u); c.fillStyle='#fff'; c.beginPath(); c.arc(p.x,p.y,3.2,0,7); c.fill(); });
    /* légende */
    const cnt=Agents.counts(); c.font='600 11px system-ui,sans-serif'; c.textAlign='left';
    if(W<600){ let lx=8; c.fillStyle='rgba(6,5,11,.65)'; c.fillRect(4,4,W-8,22); Object.entries(AGENT_STATUS).forEach(([k,s])=>{ c.fillStyle=s.color; c.beginPath(); c.arc(lx+5,15,4,0,7); c.fill(); c.fillStyle='#d9d6f2'; c.fillText(String(cnt[k]),lx+13,19); lx+=Math.floor((W-16)/7); }); }
    else { let ly=12; c.fillStyle='rgba(6,5,11,.65)'; c.fillRect(8,6,150,Object.keys(AGENT_STATUS).length*16+10); Object.entries(AGENT_STATUS).forEach(([k,s])=>{ c.fillStyle=s.color; c.beginPath(); c.arc(18,ly+4,4,0,7); c.fill(); c.fillStyle='#d9d6f2'; c.fillText(s.label+' · '+cnt[k],28,ly+8); ly+=16; }); }
  }
};
VIEWS.office = {
  skipBg(){ return !Office.simple(); },
  render(){
    const simple=Office.simple(); const c=Agents.counts();
    let h=pageHead('Bureau virtuel','Le siège numérique de '+esc(S.settings.workspace)+'. Les agents se déplacent selon leur statut : au bureau, en salle de réunion pendant une collaboration, dans l’espace collaboratif en pause. Cliquez sur un agent pour ouvrir son profil.',
      '<button class="btn sm" data-act="officeToggle">'+(simple?'Passer en 3D':'Mode simplifié')+'</button>');
    if(UI.state.officeForceSimple) h+='<div class="banner warn small mb">Le mode simplifié a été activé automatiquement car l’affichage 3D était trop lent sur cet appareil. <button class="btn sm" data-act="officeRetry3d">Réessayer la 3D</button></div>';
    if(simple){
      const Z=Office.zones(); const meet=[], lounge=[];
      Agents.active().forEach(a=>{ const st=Agents.st(a.id); if(st==='collab') meet.push(a); else if(st==='attente'||st==='termine') lounge.push(a); });
      const seat=a=>'<div class="seat" data-act="openAgent" data-id="'+a.id+'" role="button" tabindex="0">'+avatar(a,34)+'<span><b>'+esc(a.name)+'</b><small>'+esc(AGENT_STATUS[Agents.st(a.id)].label)+'</small></span></div>';
      h+='<div class="legend mb">'+Object.entries(AGENT_STATUS).map(([k,s])=>'<span><i class="dot" style="--c:'+s.color+'"></i>'+s.label+' · <b>'+c[k]+'</b></span>').join('')+'</div><div class="grid auto-l">'+
        '<div class="room cmdroom"><h4 style="color:#fb923c">✦ Centre de commandement</h4><div class="seats"><div class="seat" data-act="openAgent" data-id="DIR" role="button" tabindex="0">'+avatar(DIRECTOR,34)+'<span><b>'+DIRECTOR.name+'</b><small>Directeur IA · '+esc(AGENT_STATUS[Agents.st('DIR')].label)+'</small></span></div></div></div>'+
        Z.filter(z=>!z.cmd).map(z=>{ let seats='';
          if(z.id==='meeting') seats=meet.length?meet.map(seat).join(''):'<span class="muted small">Salle libre : les agents s’y retrouvent quand ils collaborent.</span>';
          else if(z.id==='collab') seats=lounge.length?lounge.map(seat).join(''):'<span class="muted small">Personne en pause pour l’instant.</span>';
          else seats=Agents.byDept(z.id).filter(a=>Agents.isActive(a.id)&&!['collab','attente','termine'].includes(Agents.st(a.id))).map(seat).join('')||'<span class="muted small">Postes vides (agents absents ou désactivés).</span>';
          return '<div class="room" style="border-color:'+z.color+'66"><h4 style="color:'+z.color+'">'+z.icon+' '+esc(z.name)+'</h4><div class="seats">'+seats+'</div></div>'; }).join('')+'</div>';
    } else {
      h+='<div class="office-wrap"><canvas id="office-cv" aria-label="Bureau virtuel en 3D : agents par département" role="img"></canvas><div id="office-tip" class="card" style="position:absolute;display:none;padding:8px 11px;font-size:.8rem;pointer-events:none;z-index:3;min-width:150px"></div>'+
        '<div class="office-ui"><button class="btn sm" data-act="officeRot" data-d="-1" aria-label="Pivoter à gauche">⟲</button><button class="btn sm" data-act="officeRot" data-d="1" aria-label="Pivoter à droite">⟳</button><button class="btn sm" data-act="officeZoom" data-d="1" aria-label="Zoom avant">＋</button><button class="btn sm" data-act="officeZoom" data-d="-1" aria-label="Zoom arrière">－</button><button class="btn sm" data-act="officeReset">Recentrer</button></div></div>'+
        '<p class="muted small mt">Glisser : pivoter · molette ou pincement : zoom · Maj + glisser ou deux doigts : déplacer · clic sur un département : zoom. Les trajets lumineux orange montrent les échanges entre agents en temps réel.</p>';
    }
    return h;
  },
  after(root){ const cv=$('#office-cv',root); if(cv) Office.mount(cv); },
  cleanup(){ Office.stop(); }
};
ACT.officeToggle = () => { const simple=Office.simple(); S.settings.officeMode=simple?'3d':'simple'; UI.state.officeForceSimple=false; Persist.saveSoon('settings'); renderView(true); };
ACT.officeRetry3d = () => { UI.state.officeForceSimple=false; S.settings.officeMode='3d'; Persist.saveSoon('settings'); renderView(true); };
ACT.officeRot = t => { Office.yaw+=(+t.dataset.d)*Math.PI/8; };
ACT.officeZoom = t => { Office.zoomT=clamp(Office.zoomT*(+t.dataset.d>0?1.35:1/1.35),.6,4.5); };
ACT.officeReset = () => Office.reset();

async function boot(){
  try{ await loadState(); }
  catch(e){
    Err.log('boot.loadState', e);
    S.settings=S.settings||deepMerge(DEFAULT_SETTINGS,{}); S.profile=S.profile||{type:'',activity:'',sector:'',goals:'',difficulties:'',tasksAuto:'',teamSize:34,autonomy:'autonome',done:false,skipped:true};
    S.usage=S.usage||{days:{},total:{in:0,out:0,calls:0,local:0,model:0}}; S.trading=S.trading||deepMerge(DEFAULT_TRADING,{}); S.readOnly=true;
    S.warnings.push('Chargement des données impossible ('+e.message+'). L’application démarre en mode protégé : rien n’est écrasé. Rechargez la page ou restaurez une sauvegarde.'); Agents.ensureState();
  }
  setAppearance(); Router.init();
  /* en-tête de page : « Plus tard » sur la route par défaut */
  if(!location.hash) history.replaceState(null,'','#/dashboard');
  Router.current=Router.parse(); renderChrome(); renderView(true);
  if(!S.readOnly){ LS.set('meta', S.meta); }
  Auto.checkMissed(); if(S.missedAuto.length) toast(S.missedAuto.length+' automatisation(s) manquée(s) pendant la fermeture : voir « Automatisations ».','warn',7000);
  S.warnings.forEach(w=>toast(w,'err',9000));
  if(!S.profile.done && !S.profile.skipped && !S.readOnly) setTimeout(()=>{ if(!Modal.list.length) openWizard(); }, 500);
  /* statut de sauvegarde et sécurité de fermeture */
  window.addEventListener('beforeunload', e=>{ if(runningCount()){ e.preventDefault(); e.returnValue='Des missions sont en cours d’exécution : elles seront interrompues.'; } });
  window.__nx = {S, ACT, Agents, Runner, Director, Engine, Docs, Missions, Know, Office, Trading, Auto, Providers, Guard, Backup, Router, UI, VIEWS, Modal, DEPTS, BASE_AGENTS, ROUTES};
  document.documentElement.dataset.ready='1';
}
boot();
